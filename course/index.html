`,
  body:`
<p>Pilots succeed almost everywhere. Second teams fail often enough that it has a shape, and the shape is consistent enough to plan around.</p>

<h3>The cliff</h3>
<div data-viz="mb_second_team_cliff"></div>
<p>Look at what the pilot actually had. Volunteers, usually the strongest engineers, on work that was greenfield or nearly so, with the clinical SME's attention on demand because nobody else was asking, an empty CI queue, an executive sponsor who took their calls, and permission to break convention because the point was to learn.</p>
<p>The next team has none of that. They were assigned. Their codebase is fifteen years old. The SME is now shared. The CI queue already has the pilot mob in it. And they are told to follow a method that the pilot demonstrated under conditions no longer available.</p>
<blockquote>Every rollout failure looks like a method failure and is a <strong>conditions failure</strong>. The pilot proved the method works under ideal conditions. It said nothing about contention — which is the entire subject of this course.</blockquote>
<p>The practical consequence for a rollout plan: your pilot's results are not a forecast for anyone else, and presenting them as one is how you lose credibility in the second quarter. What the pilot legitimately proved is that the method is learnable and that the tooling works in your environment. Both are real, and neither predicts throughput at three mobs.</p>

<h3>Prerequisites before the next team starts</h3>
<div data-viz="mb_prereq_checklist"></div>
<table>
  <tr><th>Prerequisite</th><th>Minimum viable version</th><th>Built in</th></tr>
  <tr><td>Validation tiers</td><td>A tier per package with evidence, and Tier 3 explicitly capped by available SME hours</td><td>M04</td></tr>
  <tr><td>One encoded golden path</td><td>A single scaffold for your most common change shape, with its fitness test</td><td>M05</td></tr>
  <tr><td>Fitness functions</td><td>Three: layer boundaries, your data-boundary rule, one contract</td><td>M06</td></tr>
  <tr><td>Merge queue</td><td>Serialised landing on trunk, whole-repository build</td><td>M08</td></tr>
  <tr><td>Canonical steering</td><td>One source, generated per-engine files, under ten root invariants</td><td>M12, M13</td></tr>
  <tr><td>Unit-of-work registry</td><td>Platform-scoped, aggregates named, loaded into elaboration context</td><td>M14</td></tr>
</table>
<p>Rolling out without these is how a platform gets M03's cycle-time regression — roughly three times the wait, none of it visible until it is a leadership conversation. Six items, and none takes more than a week for a competent platform pair. It is the cheapest insurance in this course.</p>
<p>One honest note on sequencing them: the tier table and the merge queue matter most, because they address the two contention classes that bite first. If you can only do two, do those, and say clearly what you have not done.</p>

<h3>Which team goes next</h3>
<div data-viz="mb_rollout_sequence"></div>
<p>The instinct is to pick the most enthusiastic team. Resist it, for a specific reason: you are testing conditions now, not motivation. The pilot already established that motivated people can do this. What you do not know is whether the method survives an ordinary codebase and a shared reviewer — and enthusiasm papers over exactly the evidence you need.</p>
<p>Pick a team with a boring, well-tested codebase, moderate enthusiasm, and no deadline in the next six weeks. When they succeed, you have evidence that transfers. When they struggle, the cause will be legible rather than hidden behind goodwill and unpaid overtime.</p>
<p>What to avoid for the next slot, in order of severity: the group with the untested legacy monolith (M11 is a course of its own), the group with a regulatory deadline this quarter, the group whose lead is publicly sceptical, and the group that shares its most contended module with the pilot. That last one is tempting because the pilot can help, and it guarantees you cannot distinguish contention from learning curve.</p>

<h3>Onboarding a mob mid-quarter</h3>
<p>Round 3 of The Quarter is this exercise, and it is worth rehearsing before doing it for real. The failures it produces, reliably:</p>
<ul>
  <li>The new mob's steering diverges in week one, because they copied another mob's file instead of generating from canonical.</li>
  <li>Their first three bolts all land in the Tier 3 queue, because nobody told them the tier table exists. Validator queue time doubles, and the pilot mob notices before you do.</li>
  <li>They add a unit of work that overlaps an in-flight one, because nobody wrote them into the registry at Intent Sync.</li>
</ul>
<p>All three are onboarding artifacts you can write once: generate-your-steering, read-the-tier-table, you-are-in-the-registry-from-day-one. Half a day of preparation removes most of a quarter's friction, and the reason it usually does not exist is that the pilot never needed it.</p>

<h3>Early warning that a rollout is stalling</h3>
<table>
  <tr><th>Indicator</th><th>Why it leads</th><th>Threshold to act on</th></tr>
  <tr><td><strong>Validator queue time</strong></td><td>Rises before cycle time does, and before anyone complains</td><td>Two consecutive weeks up, at any absolute level</td></tr>
  <tr><td>Tier 3 share of changes</td><td>A rising share means tiering is being applied defensively, or the new mob does not know the table exists</td><td>Above the platform's SME hour budget</td></tr>
  <tr><td>Steering drift events</td><td>The new mob is diverging quietly, which is normal and needs catching early</td><td>Any event in a new mob's first month</td></tr>
  <tr><td>Bolts abandoned or substantially reworked</td><td>The signal nobody raises in a status meeting</td><td>Any sustained rise</td></tr>
</table>
<p>Note what is absent from that list: velocity, satisfaction survey scores, and adoption percentage. All three lag, and the first two are reported by people with an interest in the answer.</p>

<h3>Saying no, and why it protects the rollout</h3>
<p>Some teams should not migrate yet, and saying so plainly is the strongest available move, because it is what makes your yes worth anything. The conversation, roughly: <em>"Your codebase has no tests around the module you would need to change first. If you start now the validation checkpoint has nothing to check against, at one mob or five, and we will both conclude the method does not work. Six weeks of characterization tests first, then you go, and you go with a real chance."</em></p>
<p>That is a defensible position with a date and a condition attached, and it reads as competence rather than obstruction. The alternative — everyone starts, half stall, and the programme acquires a reputation — is how rollouts die, and it takes about two quarters.</p>

<div class="callout honest-limit">
  <div class="k">Honest limit — the cliff is not fully preventable</div>
  <p>Every prerequisite in this module reduces the drop. None of them removes it, and it would be dishonest to imply otherwise. The pilot had scarce attention that genuinely cannot be manufactured: an SME who answered in minutes, a sponsor who cleared obstacles personally, and volunteers who wanted it to work. You can encode rules, you cannot encode enthusiasm or executive availability, and the second cohort will be slower than the pilot even when you do everything in this module. Plan for that gap and state it in advance, because a rollout plan that promises pilot-equivalent results is a plan that will be judged to have failed.</p>
  <p>Two further limits. <em>The prerequisite list is derived from one fixture and a class of platform</em> — three services, one regulated domain, one scarce specialist. If your constraint is a shared data platform, a certification body, or a single overloaded staff engineer rather than a clinical SME, the six items still apply in shape but the order will differ, and you should re-derive it rather than adopt this one. And <em>the sequencing advice assumes you get to choose</em>. Frequently you do not: the next team is chosen politically, and it is the one with the deadline and the monolith. In that case the honest move is not to refuse but to name the two conditions you know are missing, in writing, before the start — so that when the quarter goes badly the conversation is about conditions rather than about the method or the people.</p>
</div>

  title:'Making the case: risk, compliance, and the executive ask',

  audience:['leader'],

  duration:'40 min · 30 min lab',
  visuals:['mb_control_chain','mb_evidence_ladder','mb_cost_ratio'],
  crossCard:`
<p>This is the argument being made about your work in rooms you are not in, so it is worth knowing what a defensible version sounds like — and supplying the parts only you have.</p>
<p>The strong form is legitimate: tiering, executable constraints, supply-chain gates and provenance are <strong>mechanical vs cultural control</strong>s. A cultural control degrades quietly under deadline pressure and leaves no record; a mechanical one runs or fails visibly. That is a real improvement in control quality and it is the sentence that opens the risk conversation.</p>
<p>Then the limits, which is where you are needed:</p>
<ul>
  <li><em>Constraints catch what someone thought to encode.</em> The residual risk is the novel failure, and it is not small — it is different from the risk you had before.</li>
  <li><em>A mechanical control can be disabled</em> with one ignore annotation, one suppressed advisory, one quarantined test. If nobody audits who may disable a check, the claim is weaker than it sounds.</li>
  <li><em>Evidence completeness is a number, not a state.</em> Give the real one and name the fields that are missing.</li>
</ul>
<p>What to refuse to supply: a productivity multiple. Mob-level speed-ups do not survive contention at platform level, published evidence is genuinely mixed, and a quoted number you cannot defend in six months costs more than the ask it wins. Refuse unattributable statistics the same way — including the ones an assistant offers while drafting.</p>
<p><em>Read the full module for:</em> the control-chain table as a risk officer reads it, and the order to make an ask in — capacity or platform before tooling.</p>
`,
  body:`
<p>Everything in this course eventually has to survive two conversations you do not control: one with someone whose job is to find the hole in your controls, and one with someone who wants a number for the board. This module is about both, and about being credible in them.</p>

<h3>The risk conversation</h3>
<p>The risk officer's concern is not that AI wrote the code. It is that a control they understood has been replaced by something they cannot inspect. Answer that directly, and the answer is stronger than most engineers realise:</p>

<div data-viz="mb_control_chain"></div>

<table>
  <tr><th>Before</th><th>How it was enforced</th><th>Now</th><th>How it is enforced</th></tr>
  <tr><td>Senior engineer reviews clinical logic</td><td>Culturally — if they had time, and if they noticed</td><td>Tier 3 routing to a named clinical validator</td><td>Mechanically, by the tier table in the repository</td></tr>
  <tr><td>Layer boundaries respected</td><td>By convention and code review</td><td>Fitness function</td><td>Every change, no exceptions, build fails</td></tr>
  <tr><td>No member data in logs</td><td>A rule in the wiki everyone had read once</td><td>Executable check over log and exception paths</td><td>Every change, and it has caught real violations</td></tr>
  <tr><td>Dependency additions reviewed</td><td>When a reviewer happened to look at the manifest</td><td>SBOM per bolt plus CVE gate in the merge queue</td><td>Mechanically, including transitive packages</td></tr>
  <tr><td>Traceability for an audit</td><td>Reconstructed afterwards from tickets and memory</td><td>Provenance record per unit of work</td><td>Generated as a by-product at land time</td></tr>
</table>
<p>The strong form of the argument, and it is legitimate: <em>these controls are mechanical where the previous ones were cultural.</em> A cultural control degrades quietly under deadline pressure and leaves no record of having degraded. A mechanical control either runs or fails visibly. That is a real improvement in control quality, and it is the sentence to lead with.</p>

<h3>Where the argument runs out</h3>
<p>Then stop and say the other thing, plainly, because a competent risk officer will find it and it is much better coming from you:</p>
<blockquote>Constraints catch what we thought to encode. Novel failure modes are still novel, and we will not have a check for the thing that has not occurred to anyone yet. Anyone claiming this eliminates review risk is selling something.</blockquote>
<p>Ending on the limit rather than the strong form is what makes the whole argument credible. Two further honest items to volunteer rather than concede:</p>
<ul>
  <li><em>Mechanical controls can be disabled.</em> An ignore annotation, a suppressed advisory, a quarantined test. So the control set needs its own audit: who may disable a check, and where that is recorded. If you have not built that, say so and give a date.</li>
  <li><em>Evidence completeness is not 100%.</em> Ours is a number, we know what it is, and we know which fields are missing. A programme claiming complete provenance in its first year is describing an aspiration.</li>
</ul>
<p>This is also where <strong>the honest limit</strong> earns its keep as a habit rather than a section heading. Volunteering the boundary of your own claim is the cheapest credibility available in a room full of people whose job is to test claims.</p>

<h3>The executive productivity question</h3>
<div data-viz="mb_evidence_ladder"></div>
<p>You will be asked for a productivity multiple. The defensible answer has three parts and none of them is a multiple:</p>
<ol>
  <li><em>What the published evidence supports.</em> The 2025 DORA report describes throughput improvements arriving alongside stability regressions where review and delivery practice did not change. METR's randomised trial of experienced developers in their own repositories found tasks took longer with AI assistance while the developers believed they had been faster. Cite both, including the one that cuts against you — quoting only the favourable study is how you lose the room the second time.</li>
  <li><em>What we measured here.</em> Our own numbers, with their limits stated: generation is faster, validator queue time is the constraint, and cycle time at the platform level moved by X — which is a smaller number than any mob would report for itself.</li>
  <li><em>The mechanism, in one sentence.</em> Mob-level gains vanish at platform level through contention. That sentence is this entire course, and it is the part an executive can repeat accurately to someone else.</li>
</ol>
<p>What not to do: quote a mob-level speed-up as a platform result. It is the most common overclaim in this field, it is checkable, and being caught costs you the ask.</p>

<h3>Cost, honestly</h3>
<div data-viz="mb_cost_ratio"></div>
<p>Token spend per unit of work is small, measurable and falling; per mob it is a rounding error. Validator hours are large, invisible and fixed. That ratio is usually a surprise in a budget meeting, and it argues for two things: visibility over quotas, and funding capacity rather than tooling.</p>
<p>Say the second part out loud, because it is counter-intuitive coming from an engineering group: <em>we are not asking for more tools. We are asking for the specialist's time to be reallocated from reviewing to encoding, and for that reallocation to be protected.</em></p>

<h3>The ranking question, in its external form</h3>
<p>Executives ask which group is performing best, and outside parties ask which vendor or engine is performing best. M18's refusal holds and needs a shorter form for this audience: <em>"We measure the platform, not the groups, because attributing contention metrics to groups makes them stop reporting the number we most need. Here is what we do publish, and here is what it tells us to fix."</em></p>
<p>Then give them the substitute they actually wanted: where the constraint is, what it costs, and what you are doing about it. In practice that lands better than a ranking, because it comes with a decision attached.</p>

<h3>Assembling the ask</h3>
<table>
  <tr><th>Ask</th><th>When it is the right one</th><th>Evidence to bring</th></tr>
  <tr><td>Validator capacity — hours reallocated or a hire</td><td>Queue time is the constraint, which it usually is</td><td>Queue time by tier, the SME hour arithmetic, the encode break-even</td></tr>
  <tr><td>A platform pair for one quarter</td><td>You have encodable rules and nobody to encode them</td><td>The top three recurring review comments and their reuse rate</td></tr>
  <tr><td>CI capacity</td><td>Pipeline wait is material and it is cheap to fix</td><td>Queue depth, minutes per bolt, the monthly figure</td></tr>
  <tr><td>Tooling or licences</td><td>Rarely. Usually already sufficient</td><td>Only ask if you can show tooling is the binding constraint</td></tr>
</table>
<p>The order matters. Leading with a tooling request signals that you have not diagnosed the constraint, and it is the easiest ask to approve and the least likely to change the outcome — which means you will be asked next quarter why nothing improved.</p>

<div class="callout honest-limit">
  <div class="k">Honest limit — where this argument legitimately stops</div>
  <p>The control-chain argument is genuine and it is bounded in three ways you should state before someone else does. <em>Constraints only cover the failure modes you imagined</em>, so the residual risk after all of this is the novel failure, and it is not small — it is merely different from the risk you had before. <em>Mechanical controls are only as strong as the discipline around disabling them</em>: one ignore annotation added at 17:00 on a Friday and the control is gone with no alarm, so the honest position is that you have moved risk from "reviewed inattentively" to "suppressed deliberately", and the second is easier to audit but not automatically less likely. And <em>none of this addresses whether the generated code is good</em>, only whether it satisfies stated constraints. Those are different claims, and conflating them is exactly the overclaim this module tells you to avoid.</p>
  <p>One more, about the productivity question specifically: there is currently no measurement of AI-assisted delivery at multi-team scale that would satisfy a sceptical economist. The published studies are at individual or team level, with mixed results, on short horizons. If your executive wants certainty about platform-level productivity, the honest answer is that it does not exist yet, and that you are proposing to measure it rather than to assume it. That answer is available to you and it is more durable than a number you cannot defend in six months.</p>
</div>
`,

    a:`
<p><em>Deliverable:</em> a genuine one-page document for your own leadership: the ask, the evidence, the honest limits, the cost, and what you will report in ninety days. One page. If it runs to two, the ask is not clear enough yet.</p>
<p>PD reference: <em>PD-NONE</em>, justified: the artifact is a document for your actual organisation, and the judgement being graded is whether its limits section is real. A planted fixture defect would let you practise on someone else's constraints instead of stating yours.</p>
<h4>Steps — Path A, Claude Code</h4>

  <li>Write the limits section without hedging language. Name what your controls do not cover, what your evidence does not support, and one thing that could go wrong with what you are asking for.</li>

</ol>

<h4>Gate</h4>
<p>One page; the ask is capacity or platform, stated in one sentence; every number sourced; a limits section containing at least one specific checkable limitation and no unsupported productivity claim; a named ninety-day return number.</p>`,

function trackOf(id){ const r = ROSTER.find(r=>r[0]===id); return r ? r[2] : 0; }
function primaryAudOf(id){
  const m = byId(id); if (m && m.audience) return m.audience;
  const r = ROSTER.find(r=>r[0]===id); return r ? r[3] : ["leader","practitioner"];
}
/* A module outside your filter still appears if it carries a crossCard —
   the summary the other audience needs (blueprint §10). */
function audOf(id){
  const m = byId(id);
  return (m && m.crossCard) ? ["leader","practitioner"] : primaryAudOf(id);
}
function isSummaryView(id){
  const m = byId(id);
  return !!(m && m.crossCard && audience !== "all" && !primaryAudOf(id).includes(audience));
}
function visibleIds(){
  return ROSTER.map(r=>r[0])
    .filter(id => audience==="all" || audOf(id).includes(audience))
    .concat(["GLOSSARY"]);
}

function buildNav(){
  const host = document.getElementById("navlist");
  host.innerHTML = "";
  TRACKS.forEach(t => {
    const rows = ROSTER.filter(r => r[2] === t.id);
    const vis  = rows.filter(r => audience==="all" || audOf(r[0]).includes(audience));
    if (!vis.length) return;
    const head = document.createElement("div");
    head.className = "track";
    head.innerHTML = `<div class="track-name">
        <span class="track-dot" style="background:var(${t.token})"></span>${t.name}</div>`;
    host.appendChild(head);
    vis.forEach(([id,title]) => {
      const built = !!byId(id);
      const b = document.createElement("button");
      b.className = "nav-item" + (built ? "" : " is-empty");
      b.setAttribute("aria-current", id===current ? "true" : "false");
      b.innerHTML = `<span class="id">${id}</span><span class="t">${title}</span>` +
                    (isSummaryView(id) ? `<span class="sum">summary</span>` : "") +
                    (done.has(id) ? `<span class="done" aria-label="complete">●</span>` : "");
      b.onclick = () => { current = id; render(); };
      host.appendChild(b);
    });
  });

  const head = document.createElement("div");
  head.className = "track";
  head.innerHTML = `<div class="track-name"><span class="track-dot" style="background:var(--muted)"></span>Reference</div>`;
  host.appendChild(head);
  const g = document.createElement("button");
  g.className = "nav-item";
  g.setAttribute("aria-current", current==="GLOSSARY" ? "true" : "false");
  g.innerHTML = `<span class="id">§</span><span class="t">Glossary</span>`;
  g.onclick = () => { current = "GLOSSARY"; render(); };
  host.appendChild(g);
}

function renderGlossary(host){
  const total = GLOSSARY.reduce((n,s) => n + s.terms.length, 0);
  host.innerHTML = `
    <div class="eyebrow"><span>Reference</span><span class="pill">§</span></div>
    <h2 class="mod-title">Glossary</h2>
    <div class="mod-meta">${total} terms · every bolded term in the course</div>
    <p>Vocabulary as this course uses it. Where a term is contested outside these pages, the definition
       here is the one the labs and the capstone rubric are scored against.</p>
    ${GLOSSARY.map(s => `<h3>${s.section}</h3><table>` +
        s.terms.map(t => `<tr><td style="width:34%"><strong>${t.t}</strong></td><td>${t.d}</td></tr>`).join("") +
        `</table>`).join("")}`;
}

function render(){
  const host = document.getElementById("mod");

  if (current === "GLOSSARY"){
    document.documentElement.style.setProperty("--accent", "var(--muted)");
    renderGlossary(host);
    pager();
    buildNav();
    document.querySelector("main").scrollTo({top:0});
    return;
  }

  const t = TRACKS[trackOf(current)];
  document.documentElement.style.setProperty("--accent", `var(${t.token})`);
  const m = byId(current);
  const meta = ROSTER.find(r=>r[0]===current);

  if (m && isSummaryView(current)){
    const other = audience === "leader" ? "Builder" : "Leader";
    const label = audience === "leader" ? "Leader summary" : "Builder summary";
    host.innerHTML = `
      <div class="eyebrow"><span>${t.name}</span><span class="pill">${m.id}</span><span class="pill">${label}</span></div>
      <h2 class="mod-title">${m.title}</h2>
      <div class="mod-meta">summary · full module is ${m.duration||""}</div>
      <div class="callout"><div class="k">Why you are seeing a summary</div>
        <p style="margin:0">This module is written for the ${other} track. What follows is the part that
        changes your decisions, plus what you would have to read the full module for. Switch the audience
        filter to <em>All</em> to open it.</p></div>
      ${m.crossCard}`;
    pager();
    buildNav();
    document.querySelector("main").scrollTo({top:0});
    return;
  }

  if (!m){
    host.innerHTML = `
      <div class="eyebrow"><span>${t.name}</span><span class="pill">${current}</span></div>
      <h2 class="mod-title">${meta[1]}</h2>
      <div class="empty">Not built yet. Run <code>/plan-module ${current}</code> to start.</div>`;
  } else {
    const aud = (m.audience||[]).map(a=>a==="practitioner"?"Builder":"Leader").join(" · ");
    const cc  = (m.contentionClass||[]).join(" · ");
    let html = `
      <div class="eyebrow">
        <span>${t.name}</span>
        <span class="pill">${m.id}</span>
        ${aud?`<span class="pill">${aud}</span>`:""}
        ${cc?`<span class="pill">${cc}</span>`:""}
      </div>
      <h2 class="mod-title">${m.title}</h2>
      <div class="mod-meta">${m.duration||""}</div>
      ${m.body||""}`;

    if (m.lab){
      const pds = (m.lab.pd||[]).map(p=>`<span class="pd">${p}</span>`).join("");
      const agnostic = m.lab.engine === "ENGINE-AGNOSTIC";
      const comparative = m.lab.engine === "ENGINE-COMPARATIVE";
      html += `<div class="lab">
        <div class="lab-head"><span class="k">Lab</span><span class="n">${m.lab.title||""}</span>${pds}</div>`;
      if (agnostic){
        html += `<div class="lab-body">${m.lab.a||""}</div>`;
      } else {
        html += `<div class="tabs" role="tablist">
            <button role="tab" aria-selected="true"  data-p="a">${comparative?"Both engines":"Path A · Claude Code"}</button>
            <button role="tab" aria-selected="false" data-p="b">${comparative?"Divergence":"Path B · Copilot"}</button>
          </div>
          <div class="lab-body" data-panel="a">${m.lab.a||""}</div>
          <div class="lab-body" data-panel="b" hidden>${m.lab.b||""}</div>`;
      }
      html += `</div>`;
    }
    host.innerHTML = html;

    host.querySelectorAll("[data-viz]").forEach(el => { el.outerHTML = renderVisual(el.dataset.viz); });
    if (typeof m.mount === "function") { try { m.mount(host); } catch(e){ console.error(m.id, e); } }

    host.querySelectorAll(".tabs button").forEach(btn => {
      btn.onclick = () => {
        host.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b===btn)));
        host.querySelectorAll("[data-panel]").forEach(p => { p.hidden = p.dataset.panel !== btn.dataset.p; });
      };
    });
  }

  pager();
  buildNav();
  document.querySelector("main").scrollTo({top:0});
}

function pager(){
  const vis = visibleIds(), i = vis.indexOf(current);
  document.getElementById("prev").disabled = i <= 0;
  document.getElementById("next").disabled = i < 0 || i >= vis.length-1;
  const md = document.getElementById("markdone");
  md.setAttribute("aria-pressed", done.has(current) ? "true" : "false");
  md.textContent = done.has(current) ? "Completed" : "Mark complete";
}

document.querySelectorAll(".seg button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x===b)));
    audience = b.dataset.aud;
    const vis = visibleIds();
    if (!vis.includes(current) && vis.length) current = vis[0];
    render();
  };
});
document.getElementById("prev").onclick = () => {
  const vis = visibleIds(), i = vis.indexOf(current);
  if (i > 0){ current = vis[i-1]; render(); }
};
document.getElementById("next").onclick = () => {
  const vis = visibleIds(), i = vis.indexOf(current);
  if (i > -1 && i < vis.length-1){ current = vis[i+1]; render(); }
};
document.getElementById("markdone").onclick = () => {
  done.has(current) ? done.delete(current) : done.add(current);
  render();
};

render();
</script>
</body>
</html>
