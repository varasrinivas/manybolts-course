  body:`
<p>Infrastructure contention is the least glamorous of the three classes and the one most likely to be the actual constraint this quarter. It is also the only one you can fix with money, which makes the conversation different.</p>

<h3>Test volume is now a capacity problem</h3>
<p>Agents write tests willingly, which is the good news and the arithmetic problem. In the fixture, twelve weeks of three-mob work took the suite from 1,240 tests at 11 minutes to 3,890 tests at 34 minutes. Coverage went up. Nothing was wrong with any individual test. And the platform's ability to land a change fell by two thirds, because every merge-queue run now costs 34 minutes on a shared runner pool.</p>

<div data-viz="mb_ci_contention"></div>

<p>The queueing behaviour is the same as M04's — a shared server, an arrival rate, a knee past roughly 80% utilisation — with one important difference: this server can be bought. Six runners becomes twelve for a known monthly figure, and that is a far cheaper conversation than hiring a clinical SME. Take it. Then note what it does not fix: parallelism cuts wall-clock, not the number of times a suite must run, so the flake problem below gets worse per unit time rather than better.</p>

<h3>Flakes are a trust problem before they are a technical one</h3>
<div data-viz="mb_flake_cost"></div>
<p>A 2% per-job failure rate feels negligible. Across a six-job pipeline it produces a red build 11% of the time, which is once or twice a day at this platform's volume. What happens next is predictable and it is the real damage:</p>
<ol>
  <li>An engineer re-runs a red pipeline instead of reading it, because last time it was nothing.</li>
  <li>Re-runs double the load on the pool, which lengthens the queue for everyone.</li>
  <li>The pipeline stops being evidence. When a real failure arrives it gets re-run twice before anyone looks, and the merge queue lands it in the meantime.</li>
</ol>
<p>The gate you built in M06 and M07 is only worth what people believe about it. A flaky suite converts a mechanical control back into a cultural one, which is the exact regression this course spends Track 1 arguing against.</p>

<h3>PD-6, and the debugging instinct it teaches</h3>
<p><code>DeterminationServiceIT</code> fails intermittently — on the fixture, anywhere from four to eleven runs in twenty on the same machine, measured with the real runner. The cause is concurrency, not randomness. Audit records ship in 100-millisecond batches, and each determination carries the batch window of the request it decided. The service keeps that window in a field so the audit interceptor can read it without every call site threading it through — and intake decides eight requests in parallel. When two determinations overlap, one request's window lands on another's determination, and the evidence export can no longer reassemble either decision.</p>
<p>This defect is deliberately time-dependent rather than seed-dependent, because the debugging instinct differs and one of them is a habit worth building:</p>
<table>
  <tr><th>Instinct</th><th>What it does here</th></tr>
  <tr><td>Retry the test</td><td>Passes, teaches nothing, and hides a race that misfiles audit evidence whenever two determinations overlap in production</td></tr>
  <tr><td>Add a sleep</td><td>Passes locally, fails in CI, and adds runtime to a suite that is already the constraint</td></tr>
  <tr><td>Reproduce deterministically first</td><td>Pin the thread count, find the shared field, fix the code. The test was right</td></tr>
</table>
<p>Note the last row: the flaky test was not the defect. It was the only thing on the platform that knew about a real race in <code>DeterminationService</code> — one that misfiles audit evidence under load, which is exactly the gap M16 is about. Under one mob's traffic it fires rarely enough to look like a flake. Under five mobs' traffic it is a Tuesday.</p>
<h4>Quarantine policy that survives contact with a deadline</h4>
<ul>
  <li>Detected automatically — a test that fails and then passes on the same commit is flagged by the pipeline, not by a person noticing.</li>
  <li>Quarantined within 24 hours, out of the blocking suite, still running and still reporting.</li>
  <li><em>An owner and an expiry at the moment of quarantine.</em> Same rule as a feature flag, same failure mode without it: quarantine becomes a graveyard and the suite silently loses coverage.</li>
  <li>Quarantine count is reported weekly. A growing count is the leading indicator that the suite is being abandoned rather than maintained.</li>
</ul>

<h3>Tiered suites, with the cost stated</h3>
<table>
  <tr><th>Suite</th><th>Runs on</th><th>Runtime</th><th>What you accept</th></tr>
  <tr><td>Smoke</td><td>Every push</td><td>3 min</td><td>Fast signal, shallow coverage</td></tr>
  <tr><td>Merge suite</td><td>Merge queue only</td><td>12 min, impact-selected</td><td>Selection is heuristic; a wide agent diff can defeat it, so selection must fall back to full on any change touching shared modules</td></tr>
  <tr><td>Full suite</td><td>Nightly and pre-release</td><td>34 min</td><td>Up to 24 hours between a defect landing and the full suite seeing it</td></tr>
  <tr><td>Contract suite</td><td>Provider pipeline, every change</td><td>4 min</td><td>Never skip this one. It is the only thing standing between you and M09's silence</td></tr>
</table>
<p>Impact-based selection is the standard advice and it interacts badly with wide diffs: the more files a change touches, the less selection helps, and agent diffs are wide. Measure how often selection falls back to full before you promise anyone a 12-minute pipeline.</p>

<h3>Environments, and the constraint nobody costs</h3>
<div data-viz="mb_env_queue"></div>
<p>One shared UAT environment, one dataset, one deploy at a time, restored nightly. Three mobs need it for the same three days before the Thursday board. The visible cost is waiting; the hidden cost is that mobs stop using it and validate against a local stub, which moves defect discovery to production.</p>
<p>Ephemeral per-bolt environments are the correct answer and their cost is not compute — it is data. In this domain you cannot clone production: the dataset contains PHI, so every ephemeral environment needs synthetic data that is realistic enough for clinical criteria to evaluate meaningfully. Generating that data is real platform work, it needs clinical input to be credible, and it is the single most commonly underestimated item in a platform plan.</p>
<p>Which makes it an M05 investment with an unusual property: the synthetic dataset is itself a <strong>capacity multiplier</strong>, because it removes both the environment queue and part of the SME's review need — a criteria change that can be demonstrated against realistic data is a much shorter conversation than one that cannot.</p>

<h3>What to instrument</h3>
<table>
  <tr><th>Metric</th><th>Fixture baseline</th><th>What a bad number means</th></tr>
  <tr><td>Pipeline queue depth and wait</td><td>peak 6, mean 41 min</td><td>Buy runners. This one is cheap</td></tr>
  <tr><td>Flake rate per job</td><td>2.1%</td><td>Above roughly 1% the pipeline stops being read as evidence</td></tr>
  <tr><td>Quarantined test count and age</td><td>4, oldest 9 days</td><td>Age is the number that matters; a 90-day quarantine is deleted coverage</td></tr>
  <tr><td>CI minutes per landed bolt</td><td>142</td><td>Cost governance input for M18, and the first number finance will ask for</td></tr>
  <tr><td>Environment wait per bolt</td><td>6.5 h</td><td>Mobs are about to start skipping UAT, and you will find out in production</td></tr>
</table>
`,

  title:'Brownfield at scale: fifteen years, no tests, five mobs',
  track:2,
  audience:['practitioner'],

  crossCard:`
<p>Every published example of this method is greenfield. Your platform is not, and the mismatch breaks one specific thing rather than the method in general: the validation checkpoint needs an oracle, at one mob and at five. In untested legacy code nobody can tell whether a change is correct, so approval quietly degrades to <em>it compiles and the demo worked</em> — while every metric you watch still looks healthy.</p>
<p>The entry move is characterization: generate tests that pin what the code does today, including the parts that are wrong, so change becomes visible. This is the one place where agent-generated tests are unambiguously excellent, and it turns a week of work into an afternoon. That economic shift is what makes brownfield viable at all.</p>
<table>
  <tr><th>The decision you will be asked for</th><th>The answer this module defends</th></tr>
  <tr><td>Rewrite the fifteen-year-old service — agents make the first sixty per cent look achievable</td><td>No. The value in that service is years of encoded exceptions nobody can enumerate, and a rewrite must reproduce behaviour it cannot inventory. Characterize, then strangle</td></tr>
  <tr><td>Expect greenfield delivery rates in legacy</td><td>No. Expect materially slower, and say so before the second quarter arrives</td></tr>
</table>
<p><em>Read the full module for:</em> what characterization cannot do — including the real risk of pinning a bug and defending it for three years — and how to sequence strangler work so two mobs do not cut the same seam.</p>
`,
  body:`
<p>Every example in every published treatment of this method is greenfield. Real platforms are fifteen years old, and the module that matters most is the one nobody will touch.</p>

<h3>The specific breakage</h3>
<p>Brownfield does not make AI-DLC slower in some general way. It breaks one named component: the validation checkpoint needs an oracle, and at five mobs no engineer's memory can substitute for one. To validate a change you must be able to tell whether it is correct, and in untested legacy code you cannot — so validation quietly degrades into "it compiles and the demo works."</p>

<div data-viz="mb_brownfield_loop"></div>

<p>That degradation is invisible in every metric you have. Bolts land. Cycle time looks fine. The checkpoint is still in the process diagram and a human still approves. What has changed is that approval now means "I read a diff in a file I do not understand and nothing obviously wrong happened", which is not the control your risk officer thinks it is. Under one mob, a senior engineer's memory partly substitutes for the oracle. At five mobs there is not enough memory to go round.</p>

<h3>Characterization tests are the entry move</h3>
<p>A <strong>characterization test</strong> does not assert correct behaviour. It pins <em>current</em> behaviour, so that change becomes visible. You are not describing what the code should do; you are recording what it does, including the parts that are wrong.</p>

<div data-viz="mb_characterization"></div>

<p>This is the one place in this course where agent-generated tests are unambiguously excellent, and the reason is worth naming: "what does this code do with this input" is a question models answer well and humans find unbearably tedious. Feeding a 4,000-line service two hundred input permutations and recording the outputs is a job that used to cost a week and now costs an afternoon. That single change in economics is what makes brownfield AI-DLC viable at all.</p>
<p>Discipline that keeps it honest:</p>
<ul>
  <li><em>Pin observable behaviour, not implementation.</em> Inputs and outputs at the seam, not internal call sequences, or the suite breaks on every refactor and gets deleted.</li>
  <li><em>Do not let the agent "fix" what it finds.</em> It will notice that a branch returns the wrong eligibility for retirees and offer to correct it. Record the behaviour first. Whether that branch is a bug or fifteen years of deliberate accommodation is a question for someone in claims operations, not for the model.</li>
  <li><em>Name the counter-intuitive cases explicitly</em> in the test names. Those tests are documentation of the domain, and they are the artifact people will thank you for.</li>
</ul>

<h3>PD-12: EligibilityService</h3>
<p>Four thousand lines, no tests, touched by all three mobs this quarter, understood by nobody currently employed. It computes eligibility from member history, plan rules, employer overrides and three special cases that certainly matter and are certainly undocumented.</p>
<p>It is also, and this is the point, the highest-traffic module in the fixture. Legacy code that nobody touches is not a problem; legacy code that three mobs must touch, without an oracle, is where the validation checkpoint fails first at three mobs. Characterize it before anyone changes it, and prefer characterizing to understanding — you will not understand it, and you do not need to.</p>

<h3>Context scoping when the codebase exceeds any window</h3>
<table>
  <tr><th>Load</th><th>Summarise</th><th>Leave out</th></tr>
  <tr><td>The seam you are changing, its callers, its tests</td><td>Module structure, package roles, the data model</td><td>Everything not reachable from the seam</td></tr>
  <tr><td>The types crossing the seam, in full</td><td>Historical migrations, as a list of dates</td><td>Generated code, vendored libraries, build output</td></tr>
</table>
<p>Then watch for <strong>confabulated structure</strong> — the agent describing code it has not read. Concrete tells, all cheap to check:</p>
<ul>
  <li>It names a method that does not exist, usually one that <em>should</em> exist given the naming convention.</li>
  <li>It describes a hierarchy tidier than reality: three implementations of an interface that has one, or a strategy pattern where there is a switch statement.</li>
  <li>It cites a configuration key or feature flag by a plausible name that is absent from every properties file.</li>
  <li>It summarises behaviour without a single file reference. Requiring file and line per claim is the cheapest available discipline, and it changes output quality immediately.</li>
</ul>
<p>The rule: in brownfield, treat every unreferenced claim as unverified. Not wrong — unverified. Agents are excellent at reading unfamiliar code fast and dangerous at asserting what they have not read, and the difference between those two things is a file reference.</p>

<h3>Strangler fig across mobs</h3>
<div data-viz="mb_strangler_seams"></div>
<p>Strangler fig is old advice; the multi-mob part is not. Two rules:</p>
<ul>
  <li><em>Seams are ownership boundaries.</em> When you cut a seam you are creating a module that needs an owner, so choose seams that match how your mobs are actually composed (M15) rather than the cleanest cut in the code. A perfect seam with no owner becomes the next unowned library.</li>
  <li><em>One seam, one mob, one window.</em> Two mobs strangling the same seam concurrently produces two facades and a merge conflict nobody can resolve, because the conflict is between two designs rather than two diffs. Sequence it in the registry with the seam named as the resource. If you have not reached M14 yet, use <code>registry/UOW_REGISTRY.template.md</code> and record seam, mob and window — M14 is where the discipline behind that file is argued.</li>
</ul>

<h3>The rewrite pitch</h3>
<p>Be direct with the audience for this module, because they are the people who will be asked: the full rewrite is newly tempting because agents make the first 60% look achievable in weeks, and it is no more likely to succeed than it was in 2010. What has changed is that the first demo arrives sooner, which makes the commitment easier to obtain and the failure later and more expensive.</p>
<p>The specific reason it fails has not changed either: the value in <code>EligibilityService</code> is not its code, it is fifteen years of encoded exceptions that nobody can enumerate — and a rewrite must reproduce behaviour it cannot inventory. Characterization is the only tool that turns those exceptions into an inventory, which is why the honest sequence is characterize, then strangle, and why a rewrite proposal that has not characterized anything is a proposal to discover the requirements in production.</p>

<div class="callout honest-limit">
  <div class="k">Honest limit — what characterization cannot do</div>
  <p>A characterization suite pins behaviour, including bugs, and confers no correctness whatsoever. You can pin the wrong eligibility outcome for retirees and then defend it for three years, because every future change that would have fixed it now shows up as a test failure. That is a real cost of this practice, not a hypothetical one, and the mitigation is only partial: mark pinned behaviour you suspect is wrong, and review those marks with someone from operations who remembers 2013.</p>
  <p>Three more limits. <em>Coverage of a 4,000-line service is never complete</em> — you will pin the paths you thought to exercise, and the special case that matters is often the one nobody generated an input for. <em>Brownfield does not deliver greenfield cycle times</em>, and any number you have seen quoted for AI-assisted delivery was almost certainly measured somewhere with tests; expect materially slower, quote it that way, and you will keep your credibility when the second quarter arrives. And <em>some legacy code should be left alone</em>: if a module is stable, low-traffic and nobody needs to change it, characterizing it is a cost with no return. This module is about the modules your mobs must touch, which is a much smaller set than the codebase.</p>
</div>
`,

    a:`

  visuals:['mb_steering_hierarchy','mb_drift_trace','mb_shared_lib_steering'],
  body:`
<p>A <strong>steering artifact</strong> is the file your agent reads before it writes anything: <code>CLAUDE.md</code>, <code>copilot-instructions.md</code>, whatever your engine calls it. Most organisations file these under documentation. That filing decision is the mistake this module is about.</p>

<h3>Steering is load-bearing architecture</h3>
<p>One sentence in a steering file changes every future bolt in its scope. "Prefer constructor injection" is a design decision applied by a machine, without exception, to code nobody has written yet. That makes it more consequential than most pull requests and it is reviewed with less care than any of them — typically by one person, in a diff nobody blocks.</p>
<p>The precise claim: at one mob, steering is a convenience. At five mobs it is the primary mechanism by which architecture either holds or dissolves, because it is the only control that acts before generation rather than after.</p>

<h3>The hierarchy, and one rule about it</h3>
<div data-viz="mb_steering_hierarchy"></div>
<table>
  <tr><th>Level</th><th>Owns</th><th>Example in this platform</th><th>Change control</th></tr>
  <tr><td>Platform root</td><td>Invariants that hold everywhere</td><td>No PHI in logs; audit before response; criteria only via the shared evaluator</td><td>Architecture guardian, Tier 2 review, with a fitness function per invariant</td></tr>
  <tr><td>Repository</td><td>Stack and structure for this codebase</td><td>Spring conventions in api; component library rules in web</td><td>Repo owners</td></tr>
  <tr><td>Mob</td><td>Local working preferences</td><td>Test naming, commit style, how the mob likes plans presented</td><td>The mob, freely</td></tr>
  <tr><td>Session</td><td>This task only</td><td>"We are refactoring, do not add features"</td><td>Nobody, by design</td></tr>
  </table>
<blockquote><strong>Additive-only precedence</strong>: a lower level may add constraints, never remove or weaken one from above. A mob steering file that says "audit writes are optional in this service" is not a local preference. It is an unreviewed architecture change, and at five mobs it is how invariants die.</blockquote>
<p>Additive-only is easy to state and impossible to enforce by reading, because the weakening is usually implicit — a mob file that re-states a rule with a softer verb, or omits a constraint while listing the others. Which is why the rule needs a check rather than a policy.</p>

<h3>Steering drift, and how to detect it mechanically</h3>
<p><strong>Steering drift</strong> is mob-local relaxation of a root invariant, propagating into the codebase unnoticed. Two of the fixture's planted defects are instances, and they drift differently:</p>
<table>
  <tr><th>Defect</th><th>What drifted</th><th>How it became invisible</th></tr>
  <tr><td><em>PD-11</em></td><td>Two mobs' steering files specify contradictory error-handling conventions — one wraps in a domain exception, one returns a result type</td><td>Both files are internally consistent and neither is wrong. The contradiction only exists in the codebase, where the two idioms now meet at a service boundary.</td></tr>
  <tr><td><em>PD-3</em></td><td>The <code>@PhiBoundary</code> requirement is in root steering; the Gate mob's generated endpoints stopped carrying it</td><td>No file changed. The agent copied a neighbouring class that predated the rule, and nothing checked.</td></tr>
</table>

<div data-viz="mb_drift_trace"></div>

<p>Note what PD-3 implies: <em>you cannot detect drift by diffing steering files.</em> The steering estate can be perfectly consistent while generated code diverges from it. Three checks that do work, in ascending order of usefulness:</p>
<ol>
  <li><em>Invariant checksum.</em> Each root invariant has an identifier; every steering file below root must reference the set. A file missing an identifier fails CI. Catches omission, which is the most common weakening.</li>
  <li><em>Contradiction scan.</em> A scheduled job that reads all steering files and asks an agent for pairwise contradictions. Cheap, noisy, and the only thing that finds PD-11 before the code does.</li>
  <li><em>Fitness function per invariant.</em> The invariant exists twice: as a sentence for the agent and as a test for the pipeline. Catches PD-3, and every future PD-3, without anyone reading anything.</li>
</ol>
<p>The third is the real answer and it costs the most. Budget one fitness function per root invariant and keep the root list short enough that this is possible — a root steering file with forty invariants has none.</p>

<h3>Steering for a library nobody owns</h3>
<div data-viz="mb_shared_lib_steering"></div>
<p><code>priorauth-clinical-rules</code> is where this gets genuinely hard. Three mobs' agents edit it, and each arrives carrying its own mob steering. The library's own conventions — criteria immutability, no I/O in evaluation, every rule change ships with a criteria test — need to bind whoever is editing, regardless of which mob they belong to and which engine they run.</p>
<p>Two things have to be true, and on most platforms neither is:</p>
<ul>
  <li><em>The steering must live with the library</em>, in its repository, not in the consuming mob's configuration. Otherwise the rule is only as good as whichever mob remembered to copy it.</li>
  <li><em>The agent must actually load it</em> when editing that repository. This is a real limitation rather than a policy problem: an agent working in a multi-root workspace or across a dependency boundary frequently does not pick up the dependency's steering file at all. Verify it empirically on your engine — ask the agent to quote the library's steering rules back before it edits. If it cannot, your steering for that library is decorative. M09 is about that boundary in general; this is its most expensive instance.</li>
</ul>

<h3>Treat a steering change as a code change</h3>
<p>The practice that separates platforms where this holds from platforms where it does not:</p>
<ul>
  <li>Root steering changes are <strong>Tier 2</strong> at minimum, reviewed by the <strong>architecture guardian</strong>, with the fitness function landing in the same change. No invariant without a check.</li>
  <li>Every root invariant carries an identifier, an owner, and the test that enforces it. Three columns, one table, in the repository.</li>
  <li><strong>Steering drift</strong> events are counted and reported, the same way you count contract breakages. It is one of the eight capstone metrics, and a rising count is the earliest available signal that mob autonomy has drifted into architectural divergence.</li>
</ul>
<p>None of this is in the published method, which describes steering files as capturing team conventions and stops there. At one mob that is sufficient. The hierarchy, the precedence rule and the drift checks are this course's addition, and they are the cheapest of the additions to adopt.</p>
`,

{
  id:'M13',
  title:'Mixed-engine estates',
  track:3,
  audience:['practitioner'],
  contentionClass:['code'],

  visuals:['mb_engine_fanout','mb_dialect_compare','mb_steering_conflict'],
  crossCard:`
<p>Procurement bought one engine, a mob was already faster with another, and a third arrived with an acquisition. One platform running several engines is normal rather than pathological. It becomes a governance problem only when the same architectural intent is maintained twice, in two dialects of configuration, and the copies diverge one bullet at a time in files nobody diffs.</p>
<table>
  <tr><th>Rule</th><th>Consequence if you skip it</th></tr>
  <tr><td>One <strong>canonical steering source</strong>; per-engine files are generated, and CI fails if a generated file is edited directly</td><td>The first hotfix typed into a generated file becomes the truth for one engine only</td></tr>
  <tr><td>Standardise only where two mobs' code meets: invariants, security, error handling at boundaries, contract shape</td><td>Governing comment density spends the goodwill you need for the rules that matter</td></tr>
  <tr><td>Provenance records the engine and its version</td><td>When a systematic defect appears across nine files, you cannot ask whether they share a producer</td></tr>
</table>
<p>One thing not to fund: an engine bake-off. Model releases move the differences, so any comparison's conclusions expire. What is durable is the measurement — one identical unit of work per engine, diffed and kept, re-run when a version changes.</p>
<p><em>Read the full module for:</em> which differences actually reach the codebase and which are cosmetic, and how two internally consistent conventions produce a bug that survives both mobs' test suites.</p>
`,
  body:`
<p>Every other module in this course is engine-neutral and offers both paths. This one is about the difference between them, because on a real platform you do not get to choose one.</p>

<h3>The reality nobody planned</h3>
<p>Procurement bought one engine for the enterprise. A mob was already using another and is faster with it. A third arrived with an acquisition. Somebody has a personal preference and a good argument. The result is normal rather than pathological: <em>one platform, several engines, one codebase.</em></p>
<p>Two mobs on different engines is not a governance problem in itself. It becomes one when the same architectural intent is expressed twice, in two dialects of configuration, and the two copies diverge silently. That is the whole subject of this module.</p>

<h3>One canonical source, generated fan-out</h3>
<div data-viz="mb_engine_fanout"></div>
<p>The rule is simple and it is violated almost everywhere: maintain one <strong>canonical steering source</strong> and generate the per-engine files from it. Never hand-maintain parallel copies, because parallel copies do not diverge loudly — they diverge one bullet at a time, in files nobody diffs.</p>
<pre><code>governance/STEERING.canonical.md        # the only file a human edits
  → generated/CLAUDE.md                # engine A dialect
  → generated/copilot-instructions.md  # engine B dialect
  → generated/INVARIANTS.json          # machine-readable, for the drift check

CI fails if any generated file is newer than the canonical source.</code></pre>
<p>That last line is the entire enforcement mechanism, and it is four lines of pipeline. Without it, the first hotfix edited directly into a generated file becomes the new truth for one engine only.</p>

<h3>Dialect, observed rather than asserted</h3>
<p>Engines differ systematically in what they produce from identical instructions. That systematic difference is <strong>engine dialect</strong>, and it shows up in a codebase as divergence when mobs split by engine.</p>

<div data-viz="mb_dialect_compare"></div>

<div class="callout">
  <div class="k">Measure this on your own estate, and expect it to change</div>
  <p style="margin:0">The differences below are what the fixture's unit of work produced on the engines available when it was recorded. Model releases change them, sometimes substantially, and any course that hands you a fixed table of engine characteristics is selling you a stale benchmark. The durable skill is the measurement: run one identical unit of work on each engine your platform uses, diff the output, and keep the diff. Repeat it when a model version changes. That artifact is worth more than anyone's comparison chart, including this one.</p>
</div>

<table>
  <tr><th>Dimension</th><th>What varied in the fixture run</th><th>Does it matter?</th></tr>
  <tr><td>Test verbosity</td><td>One engine produced 14 test methods for the unit of work, the other 6, covering the same paths</td><td>Only as suite runtime — which is M10's problem, and 34 minutes is already the constraint</td></tr>
  <tr><td>Error-handling idiom</td><td>Domain-exception wrapping versus result objects, each consistent with its own mob's steering</td><td><strong>Yes.</strong> Two idioms meeting at a service boundary is PD-11, and it is a correctness surface, not a style question</td></tr>
  <tr><td>Comment density</td><td>Roughly twice as many explanatory comments in one</td><td>No. Do not spend governance on this.</td></tr>
  <tr><td>Cross-file reach</td><td>One engine edited three files for the change; the other edited one and left a caller broken</td><td><strong>Yes.</strong> It changes what your merge queue must catch — see M08</td></tr>
</table>

<h3>PD-11 surfacing</h3>
<div data-viz="mb_steering_conflict"></div>
<p>Two mobs, two engines, two steering files, both internally consistent. One wraps failures in a domain exception; the other returns a result type. Neither convention is wrong. Neither steering file mentions the other. The contradiction has no representation anywhere in configuration — it exists only in the generated code, at the boundary where an Appeals service calls a Gate service, where one side throws and the other checks a return value.</p>
<p>What that costs, concretely: the caller handles the failure path that its own convention predicts and silently ignores the other. An appeal that fails criteria evaluation returns a result the caller reads as success. This is the class of bug that survives both mobs' test suites, because each mob tests its own convention.</p>

<h3>What to standardise, and what to leave alone</h3>
<table>
  <tr><th>Standardise</th><th>Leave to the mob</th></tr>
  <tr><td>Architectural invariants and layer boundaries</td><td>Prompt style and how a mob likes plans presented</td></tr>
  <tr><td>Error-handling convention at service boundaries</td><td>Formatting, naming preferences, comment density</td></tr>
  <tr><td>Security and PHI rules, without exception</td><td>Test framework preference within a repo's stack</td></tr>
  <tr><td>Contract shape and versioning</td><td>Which engine, mostly — see the caveat below</td></tr>
</table>
<p>Standardise a convention only where two mobs' code meets. Everything else is preference dressed as governance, and governing it costs you the goodwill you will need for the rules that matter.</p>
<p>The caveat on engine choice: leave it to the mob <em>if</em> your provenance chain records which engine produced which change (M16) and <em>if</em> your steering fan-out is generated rather than hand-copied. Without both, engine choice is a governance decision you have delegated by accident.</p>

<h3>Provenance across engines</h3>
<p>The record must name the engine and its version, alongside mob, validator, tier and steering version. Two reasons, and the second is the one that matters at three in the morning:</p>
<ul>
  <li>Auditors ask what produced a clinical change. "An AI assistant" is not an answer that closes a finding.</li>
  <li>When a systematic defect appears — the same missing null check across nine files — the first useful question is whether those nine changes share an engine, a steering version, or a mob. Without the engine field you cannot ask it, and M17 is the module where you will want to.</li>
</ul>
<p>This course teaches two engines, and that is a deliberate scoping decision rather than a claim that two is all you will have. A third engine adds a column to your fan-out and nothing to the lesson: the mechanism is one canonical source, generated outputs, standardisation only where code meets, and provenance that names the producer.</p>
`,

    a:`
<p><em>Deliverable:</em> a canonical steering source with generated per-engine files, a CI check that fails when a generated file is edited directly, the same unit of work run on both engines with the outputs diffed and kept, and a resolution of <em>PD-11</em> that is a fitness function rather than a longer steering document.</p>
<h4>Both engines — the shared procedure</h4>
<ol>
  <li>Write <code>governance/STEERING.canonical.md</code> containing the numbered invariants from M12 plus the error-handling convention you are about to decide. One file, one author, no engine-specific phrasing in it.</li>

  <li>Pick one small unit of work — <code>UOW-52</code>, the derived status display, is the right size, and it is in <code>registry/UOW_REGISTRY.template.md</code> if you have not reached M14 and built the registry yet — and run it end to end on <em>both</em> engines from the same canonical steering, in separate branches.</li>
  <li>Diff the two outputs. Record what differed under four headings: files touched, test count, error-handling idiom, callers updated. Save the diff at <code>records/M13_DIALECT.md</code> with the engine versions written down — the versions are what make the record re-checkable in six months.</li>
  <li>Now resolve <em>PD-11</em>: decide which error-handling convention is the invariant at service boundaries, write the one-line reason, and encode it as a check that fails when the losing convention crosses a boundary.</li>
</ol>
<h4>If you only have one engine</h4>
<p>Run steps 1, 2 and 5 as written: the canonical source, the generated fan-out, the direct-edit check and the PD-11 resolution are all single-engine work, and they are most of the gate. For steps 3 and 4, substitute a second <em>configuration</em> for the second engine — run the same unit of work twice on your engine, once with the canonical steering loaded and once with it deliberately withheld, and diff the output under the same four headings. That measures whether your steering is load-bearing, which is the more useful finding of the two and the one that survives a model release. Record it at <code>records/M13_DIALECT.md</code> with the same version detail. You will not have seen engine dialect, and you should not claim to have.</p>
<h4>Graded moment</h4>
<p>Asked to resolve the convention conflict, both engines will suggest adding guidance to the steering file, and one will offer to write an adapter that accepts either convention. The adapter is the more seductive answer and the worse one: it makes the divergence permanent and invisible by design. The gate for this lab is explicit about it — the resolution must be able to fail a build, because a convention that cannot fail a build is not a convention on a platform with more than one mob.</p>
<h4>Gate</h4>
<p>Canonical source is the only hand-edited file; the direct-edit check fails when you edit a generated file; the dialect diff exists with engine versions recorded; PD-11 resolved by a fitness function, and the divergence correctly classified as convention rather than correctness — except at the boundary, where it is both.</p>`,
    b:`
<p><em>What diverged, and what to do with it.</em> This panel is the analysis half of the same lab — read it after you have both branches in front of you.</p>
<h4>The four readings</h4>
<table>
  <tr><th>Reading</th><th>Question to answer from your diff</th><th>What the answer changes</th></tr>
  <tr><td>Files touched</td><td>Did both engines update every caller of the changed signature?</td><td>If one did not, your merge queue must build the whole repo rather than the changed module (M08)</td></tr>
  <tr><td>Test count</td><td>Do the extra tests cover extra paths, or the same paths more verbosely?</td><td>Verbose duplication is suite-runtime debt on a shared runner pool (M10)</td></tr>
  <tr><td>Error idiom</td><td>Do the two outputs agree on what a failure looks like at the boundary?</td><td>This is PD-11. Disagreement here is a correctness surface, not a preference</td></tr>
  <tr><td>Steering fidelity</td><td>Did both engines actually honour every invariant in the canonical source?</td><td>An invariant one engine ignores needs a fitness function today, not a stronger sentence</td></tr>
</table>
<h4>The divergence that is not a dialect problem</h4>
<p>One finding in this lab is commonly misread. If an engine omits an invariant from the canonical source, that is not dialect — that is your steering not being load-bearing on that engine, and the correct response is a check in the pipeline rather than a rewrite of the instruction. Mobs will otherwise spend weeks rephrasing prose to persuade a model, which is the least durable control available.</p>
<h4>Where this lab stops</h4>
<p>You have not learned which engine is better and the lab is not designed to tell you. You have learned which differences reach the codebase and which do not, and you now own a re-runnable measurement for the next model release. If a comparison of engines is what your organisation actually wants, it needs its own study with your own units of work — and its conclusions expire.</p>
<h4>Gate</h4>
<p>Same gate as the shared procedure: canonical source is the only hand-edited file, the direct-edit check works, the dialect diff is recorded with engine versions, and PD-11 is resolved by something that can fail a build.</p>`

{
  id:'M14',
  title:'Cross-mob intent decomposition and Intent Sync',
  track:3,
  audience:['leader','practitioner'],
  contentionClass:['code','validator'],
  duration:'45 min · 40 min lab',
  visuals:['mb_intent_sync','mb_uow_registry','mb_overlap_map'],
  body:`
<p>Elaboration is where the method is strongest and where the multi-mob gap is widest. A mob turns an intent into units of work with acceptance criteria, and does it well. Two mobs do that independently, both well, and produce work that collides — not at merge time, which would be survivable, but at design time, which is not visible until merge time.</p>

<h3>The unmodelled step</h3>
<p>There is no defined ritual for reconciling parallel elaborations. Mob Elaboration assumes one mob is decomposing this part of the domain; nothing in the method says what happens when three are. In practice the reconciliation happens anyway — in a merge conflict, six days later, resolved by whichever agent is asked to fix the rebase.</p>

<div data-viz="mb_overlap_map"></div>

<p><em>PD-4</em> is the fixture's instance and it is deliberately realistic. Three intents, elaborated separately, produce three units of work that all write <code>AuthStatus</code> transitions:</p>
<table>
  <tr><th>Mob</th><th>Unit of work</th><th>Aggregate touched</th><th>How it reads in isolation</th></tr>
  <tr><td>Appeals</td><td>Add APPEALED and APPEAL_UPHELD states</td><td><code>AuthStatus</code>, <code>Determination</code></td><td>Obviously theirs. Nobody would question it.</td></tr>
  <tr><td>Gate</td><td>Emit a criteria-specific threshold decision on the determination</td><td><code>Determination</code>, <code>AuthStatus</code> (sets AUTO_APPROVED)</td><td>Reads as a rules change, not a status change. This is the one that hides.</td></tr>
  <tr><td>Portal</td><td>Show pending-review status with an estimated decision date</td><td><code>AuthStatus</code> (adds a derived state)</td><td>Reads as a UI change. It adds a state to the enum.</td></tr>
</table>
<p>Two of these are easy to spot in the same room. The third — Portal's derived state — reads as presentation work and arrives as a change to the shared enum. Any deconfliction process that relies on people describing their own work in their own words will miss it; a process that asks which aggregates you will touch will not.</p>

<h3>Intent Sync</h3>
<p>This is the course's addition, and it is deliberately small: a 90-minute session <strong>before</strong> parallel elaborations begin, not a review after they finish. If it runs after elaboration, it is a conflict-resolution meeting, which is what you already have.</p>

<div data-viz="mb_intent_sync"></div>

<table>
  <tr><th>Element</th><th>Specification</th></tr>
  <tr><td>When</td><td>Before mobs elaborate, once per planning window. Fifteen minutes per active intent, hard-stopped.</td></tr>
  <tr><td>Who</td><td>One person per mob who will actually be in that mob's elaboration, plus the architecture guardian. Not managers reporting on behalf of mobs.</td></tr>
  <tr><td>The only question</td><td>Which aggregates, contracts and shared files will your intent touch? Named, not described.</td></tr>
  <tr><td>Outputs</td><td>Registry entries for every planned unit of work; a boundary contract wherever two mobs must touch one aggregate; a sequencing decision wherever they must not both proceed.</td></tr>
  <tr><td>Not an output</td><td>Estimates, commitments, capacity allocation, or a plan for the quarter.</td></tr>
</table>

<div class="callout">
  <div class="k">This is not a scaled-agile planning event</div>
  <p style="margin:0">Say so before someone else says it for you. There is no cadence beyond "before elaboration", no commitment ritual, no capacity negotiation, no dependency board carried forward between sessions, and no role that owns the meeting's throughput. It exists to answer one question — who is touching what — and it ends when that question is answered. The honest similarity is that both practices exist because independent teams share a codebase. The honest difference is that this one produces two artifacts and no plan, and it takes 90 minutes rather than two days.</p>
</div>

<h3>The unit-of-work registry</h3>
<p>The registry is the durable artifact. It is an in-repo record of which mob owns which unit of work, which aggregates it touches, and which contract surfaces it changes.</p>

<div data-viz="mb_uow_registry"></div>

<pre><code>| UoW    | Mob     | Aggregates            | Contract surfaces        | Status   |
|--------|---------|-----------------------|--------------------------|----------|
| UOW-41 | appeals | AuthStatus, Determ.   | GET /determinations/{id} | in bolt  |
| UOW-47 | gate    | Determ., AuthStatus   | criteria-eval v3 (jar)   | elaborated |
| UOW-52 | portal  | AuthStatus (derived)  | none declared            | in bolt  |</code></pre>

<p>Four properties matter, and three of them are commonly got wrong:</p>
<ul>
  <li><em>Scope is per platform, not per repository.</em> The registry that lives in one repo cannot see the collision that matters, because the collisions worth catching cross repositories. Put it in the fixture's <code>registry/</code> directory, alongside the intents, and have all three repos reference it.</li>
  <li><em>Written at Intent Sync, before the bolt.</em> A registry updated after landing is a changelog.</li>
  <li><em>Loaded into agent context during elaboration.</em> This is the payoff: an agent that can see the registry will flag "UOW-47 already touches this aggregate" while the elaborating mob is still deciding, which is the only moment the information is cheap. It is the single highest-value context injection on the platform.</li>
  <li><em>Aggregates named, not described.</em> "Status handling" catches nothing. <code>AuthStatus</code> catches PD-4.</li>
</ul>

<h3>Boundary contracts</h3>
<p>Sometimes sequencing is not an option and two mobs must touch one aggregate in the same window. The answer is a <strong>boundary contract</strong>: an explicit, tested surface between them, agreed at Intent Sync and enforced in CI.</p>
<p>For PD-4, the defensible contract is that <code>AuthStatus</code> transitions are owned by <code>priorauth-api</code> and exposed as a state machine with an enumerated transition table; Appeals adds transitions to the table; Portal derives display state from it and adds nothing to the enum; Gate writes only through the existing transition API. One consumer-driven contract test per party, all three running in the api pipeline (M06's mechanism). Now the collision is a build failure on the day it happens rather than a rebase three weeks later.</p>

<h3>Overlap rate</h3>
<p>Count the units of work that touch an aggregate another mob's unit of work also touches, as a share of all units of work in the window. In the fixture's round 1 it is 27%, which is high and which nobody knew before the registry existed.</p>
<p>Treat that number as a diagnostic rather than a scheduling problem. A persistent overlap rate above roughly 20% is telling you that mob boundaries do not match the module seams — the same information M15 reads from the code, arriving here as a metric. Deconfliction manages the symptom; M15 asks whether the org chart is the actual defect.</p>
`,

{
  id:'M15',
  title:"Conway's law at agent speed",
  track:3,
  audience:['leader','practitioner'],
  contentionClass:['code'],
  duration:'40 min · 30 min lab',
  visuals:['mb_conway_speed','mb_mob_split','mb_overlap_diagnostic'],
  body:`
<p>Conway's law, restated: a system mirrors the communication structure of the organisation that built it. The AI-DLC twist is uncomfortable and specific.</p>

<h3>Agents do not transcend Conway's law. They enforce it.</h3>
<p>A mob's agent is scoped to the mob's context: its repositories, its steering, its open files, its history. It has no view across the team boundary at all — not a partial view, none. Humans in the same position at least gossip. They overhear a standup, they were on the other team last year, they ask someone at lunch. That informal channel is the main thing that used to soften Conway's law, and an agent has no equivalent.</p>

<div data-viz="mb_conway_speed"></div>

<p>So the organisational structure now reaches the code faster, more literally, and with fewer accidental corrections. <strong>Conway acceleration</strong> is the term this course uses for it. The practical consequence: a badly placed team boundary used to take a year to become an architectural fact. It now takes a quarter.</p>

<h3>The evidence is in the fixture</h3>
<p><code>priorauth-clinical-rules</code> has no owner (<em>PD-8</em>), and its code shows exactly what that produces. Three mobs' idioms layered on each other: Appeals' exception style in one package, Gate's result types in another, Portal's null-tolerant helpers in a third, and two competing criteria-lookup paths that do the same thing differently.</p>
<blockquote>The architecture of an unowned module is the average of everyone who touched it — and an average of three good designs is not a design.</blockquote>
<p>Notice this is not a code-quality claim. Every individual contribution is defensible; the incoherence is structural, and it is a readout of the org chart. No amount of review effort inside individual pull requests produces coherence here, which is why M05's ownership decision is an architecture decision rather than an administrative one.</p>

<h3>Mob composition is an architecture decision</h3>
<div data-viz="mb_mob_split"></div>
<table>
  <tr><th></th><th>Split by feature</th><th>Split by service</th></tr>
  <tr><td>What a mob owns</td><td>An end-to-end capability across web, api and rules</td><td>One repository, all features in it</td></tr>
  <tr><td>Cross-repo bolts</td><td>Most bolts. Every one crosses the context boundary the agent cannot see</td><td>Rare. Bolts stay inside one context</td></tr>
  <tr><td>Cross-mob coordination</td><td>Low per feature, high per module — three mobs edit every module</td><td>High per feature — every feature needs three mobs in sequence</td></tr>
  <tr><td>What the codebase looks like after a quarter</td><td>Coherent features, incoherent modules. Shared libraries drift toward the PD-8 pattern</td><td>Coherent modules, features smeared across releases and hard to trace</td></tr>
  <tr><td>What it does to the registry</td><td>High overlap rate, mostly on shared aggregates</td><td>Low overlap rate, high sequencing dependency</td></tr>
</table>
<p>Neither is correct in general. What matters is that the choice is being made either way, and that under AI-DLC its consequences arrive inside a quarter instead of after a reorg cycle. Feature-split mobs need the M14 registry and boundary contracts to survive; service-split mobs need Intent Sync sequencing and will feel slow per feature. Choose the failure you can operate.</p>

<h3>Ownership boundaries should follow module seams</h3>
<p>When ownership and seams align, most bolts stay internal and the registry is quiet. When they do not, every bolt is a cross-boundary bolt, and the registry fills up with overlaps — which gives you a measurement you did not have before.</p>

<div data-viz="mb_overlap_diagnostic"></div>

<p>This reframes M14's artifact. The registry's <strong>overlap rate as diagnostic</strong> is not primarily a scheduling tool; it is an org-design instrument. Sustained overlap above roughly 20% in the same aggregate, quarter after quarter, is not a coordination failure to be managed harder. It is the codebase telling you that two mobs own one thing.</p>
<p>The diagnostic is cheap and it is the only one in this course that turns a coordination metric into an organisational argument you can put in front of a director with evidence attached.</p>

<h3>The inverse manoeuvre, honestly</h3>
<p>The textbook move is to change the team structure to get the architecture you want. It works. It is also expensive, political, slow, and usually not yours to call — and an inverse Conway manoeuvre justified by a chart of overlap rates will be received as an engineering team asking for a reorg.</p>
<p>What actually travels, in this order:</p>
<ol>
  <li><em>Assign the unowned thing.</em> Cheapest intervention available, requires no reorg, and fixes the specific defect PD-8 represents. Do this first and always.</li>
  <li><strong>Boundary contract</strong>s where two mobs must share an aggregate (M14). Makes the misalignment survivable and, importantly, makes its cost visible in build failures rather than in delay.</li>
  <li><strong>Designated maintainer</strong>s for shared modules — real hours, named people, an entry in CODEOWNERS.</li>
  <li><em>Move one person</em>, not a team. A single embedded engineer with dual context does more for a bad seam than a reorg proposal, and can be arranged this week.</li>
  <li><em>Propose the composition change</em> only when you can show the overlap rate over two quarters and the cost in delay-days. Then it is a business case rather than a preference.</li>
</ol>
<p>And when none of that is available: accept that some seams are badly placed, put the contracts in, and stop paying the coordination cost twice by also relitigating the org chart every quarter.</p>
`,
  lab:{

    pd:['PD-8'],
    a:`

<h4>Steps — Path A, Claude Code</h4>

<p>The agent will infer teams from directory names and file headers, which is the same failure as M02's ownership question wearing different clothes: it produces a plausible org chart that reflects the folder layout rather than the people. Force it onto behavioural evidence — who commits together, which idioms cluster, where reviews come from — and you will get a different and better answer. Expect it to over-merge as well: two mobs with similar idioms will be reported as one, and the tell is the review pattern rather than the code.</p>
<h4>Gate</h4>

{
  id:'M16',
  title:'Release coordination and audit evidence',
  track:4,
  audience:['leader','practitioner'],
  contentionClass:['validator','infrastructure'],
  duration:'40 min · 40 min lab',
  visuals:['mb_release_train','mb_provenance_chain','mb_flag_debt'],
  body:`
<p>Six mobs land changes continuously. The business releases on a Thursday, after a board meeting, in a regulated market where a wrong clinical determination is a reportable event. Both of those facts are fixed, and the practice that reconciles them is old: separate deploying from releasing.</p>

<h3>Deploy–release decoupling</h3>
<p><strong>Deploy–release decoupling</strong> means code ships to production continuously behind flags, and the business decides when behaviour changes. It is standard practice and it is the only mechanism that lets continuous landing coexist with a Thursday change advisory board.</p>

<div data-viz="mb_release_train"></div>

<p>What changes under AI-DLC is the flag count. Bolts are small and frequent at three mobs, each one arrives wanting a flag, and nobody removes them. In the fixture's first quarter, three mobs created 34 flags and removed 6.</p>

<h3>Flag debt</h3>
<div data-viz="mb_flag_debt"></div>
<p><strong>Flag debt</strong> is not a tidiness problem. Each live flag doubles the number of code paths in production that nobody has tested in combination, and by flag twenty the combinatorics are past anyone's ability to reason about. The specific failure it produces in this domain: a determination path that behaves correctly under every flag combination tested and incorrectly under the one live in production on the day of an audit.</p>
<p>Two rules, and the second is the one that actually holds:</p>
<ul>
  <li><em>Every flag has an owner and an expiry at creation.</em> Not a review date — an expiry, in the flag definition, as a required field.</li>
  <li><em>A flag past expiry fails the build.</em> Reporting flag debt weekly produces a chart that goes up. Failing the build produces flag removal, and it is the same mechanical-versus-cultural argument as everywhere else in this course.</li>
</ul>
<p>Then measure flag <em>age</em>, not count. Twelve flags all under two weeks old is a healthy platform landing work continuously; four flags averaging nine months is an untested production configuration nobody can describe.</p>

<h3>The provenance chain</h3>
<p>Regulated release needs evidence: what changed, why, who decided it was safe, and what checked it. The <strong>provenance chain</strong> is that evidence, produced as a by-product of the bolt rather than assembled afterwards by a person.</p>

<div data-viz="mb_provenance_chain"></div>

<table>
  <tr><th>Field</th><th>Where it comes from</th><th>The question it answers</th></tr>
  <tr><td>Unit of work</td><td>Registry (M14)</td><td>What was this change for?</td></tr>
  <tr><td>Mob</td><td>Registry, CODEOWNERS</td><td>Who was accountable?</td></tr>
  <tr><td>Engine and version</td><td>Session metadata (M13)</td><td>What produced it? Also: does a systematic defect correlate with a producer?</td></tr>
  <tr><td><strong>Validator identity</strong></td><td>Review record</td><td>Who decided this was safe? This is the field auditors ask about first.</td></tr>
  <tr><td>Tier</td><td>Tier table (M04)</td><td>Was it reviewed at the right level?</td></tr>
  <tr><td>Steering version</td><td>Canonical steering hash (M12)</td><td>Which rules were in force when it was generated?</td></tr>
  <tr><td>Fitness gates passed</td><td>Pipeline output (M06, M07)</td><td>What was mechanically verified, and what was not?</td></tr>
</table>
<p>The economic argument for building this is not compliance. It is that the same record is the fastest path from a production symptom to the context you need at three in the morning — which is M17, and the reason this module comes first.</p>

<h3>PD-7: the field that is not there</h3>
<p>The fixture's provenance schema is v1, and it records the pull request approver rather than the validator. Those are different people and the difference is the entire point of tiering. The approver is whoever clicked; the validator is the person qualified for that tier who made the safety judgement. For a Tier 3 clinical change, v1 cannot tell you whether a clinician was ever involved.</p>
<p>So when compliance asks "who approved the threshold change on the 14th?", the honest answer from v1 is a name that may belong to an engineer who merged it. Producing that name and calling it evidence is worse than having no record, because it converts an unknown into a false statement in an audit file.</p>
<pre><code>PROVENANCE_SCHEMA.v2  — the fields v1 is missing
  validator_identity      required   who made the safety judgement
  validator_qualification required   why they were entitled to make it at this tier
  tier_at_review          required   tier assigned when reviewed, not current tier
  steering_hash           required   canonical steering in force at generation
  gates_passed[]          required   named fitness functions, with results
  engine, engine_version  required   producer identity (M13)

Backfill policy: any field that cannot be evidenced is recorded as
unknown. Never inferred. An inferred validator is a fabricated control.</code></pre>

<h3>Coordinating a release across three repositories</h3>
<table>
  <tr><th>Approach</th><th>Fits when</th><th>Cost</th></tr>
  <tr><td>Independent release per repo</td><td>Contracts are versioned and tested both ways (M06, M09)</td><td>Requires real contract discipline; without it you get M09's silence</td></tr>
  <tr><td>Coordinated train on the board's cadence</td><td>Cross-repo behaviour changes, clinical rule changes</td><td>Slowest common denominator; every mob waits for the least ready</td></tr>
  <tr><td>Independent deploy, coordinated release</td><td><em>This platform.</em> Continuous landing, flags flipped together on Thursday</td><td>Flag discipline becomes load-bearing — see above</td></tr>
</table>
<p>What the board actually needs, and it is less than most teams prepare: what behaviour changes for members and providers, what the rollback is and whether it has been tested, and which changes touched clinical rules with the validator named. If your provenance chain is real, that packet is generated rather than written, and the meeting gets shorter.</p>

<h3>Evidence completeness as a metric</h3>
<p>Count the share of landed units of work whose provenance record has every required field populated, with no inferred values. In the fixture's first quarter it is 61%, and every gap is a question someone will eventually ask about a change nobody remembers.</p>
<p>It is one of the eight capstone metrics, and it is the one that most reliably distinguishes a platform that will survive an audit from one that will spend three weeks reconstructing history from commit messages.</p>
`,

    pd:['PD-7'],
    a:`
<p><em>Deliverable:</em> <code>platform-fixture/evidence/PROVENANCE_SCHEMA.v2.json</code>, a generator that emits a provenance record per landed bolt, a backfill of the quarter's records with unevidenced fields marked unknown, and written answers to the five questions in <code>evidence/auditor-questions.md</code> with a citation per answer.</p>
<h4>Steps — Path A, Claude Code</h4>
<ol>
  <li>Read the five auditor questions first, then read v1. Write down which questions v1 can answer and which it cannot before designing anything — that gap is the specification.</li>
  <li>Design v2. Add validator identity and qualification, tier at review, steering hash, named gates with results, and engine identity. Keep it flat and machine-generated; a schema requiring human narration will not be populated by week three.</li>

<p>Asked to backfill validator identity, the agent will populate it from git history — the approver, the last committer, or whoever reviewed the pull request — and the file will look complete. This is the single most dangerous artifact produced anywhere in this course: a fabricated control, in an audit record, that reads as evidence. It will not be described as inference; it will be presented as the backfill you asked for. Your backfill must distinguish evidenced from inferred, and every inferred value must become <code>unknown</code>.</p>
<h4>Gate</h4>
<p>v2 records validator identity and qualification separately from the approver; the generator produces a record without human narration; the backfill contains unknowns and a count of them; all five auditor questions answered with citations, including at least one honest "cannot evidence".</p>`,
    b:`
<p><em>Deliverable:</em> identical — v2 schema, an automatic record generator, an honest backfill with unknowns counted, and five cited answers. Same gate.</p>
<h4>Steps — Path B, GitHub Copilot</h4>

<p>Identical to Path A: validator identity and qualification distinct from approver, required fields genuinely required, generator needs no human narration, backfill counts unknowns, five cited answers with at least one honest gap.</p>`
  }
},

  crossCard:`
<p>The postmortem section, which is the part of this module that is yours.</p>
<p>The new failure mode is a Sev-2 whose cause sits in code that landed six weeks ago and that nobody on the call has read. Under sprints someone always remembered; at this volume nobody does. That is a trade your organisation made deliberately — authorship memory for throughput — and it needs a replacement mechanism rather than an apology.</p>
<p><em>"The agent wrote it" is not a cause.</em> A review that stops there produces no system change and teaches everyone to be more careful, which is not a control. The causes actually available, each with a fix that lands as a change:</p>
<table>
  <tr><th>Cause</th><th>Fix</th><th>Built in</th></tr>
  <tr><td>Tier misassignment — clinical logic reviewed as service-internal</td><td>Correct the tier table; add the evidence rule that prevents the class</td><td>M04</td></tr>
  <tr><td>Missing constraint — the invariant existed only as a sentence</td><td>Write the executable check</td><td>M06</td></tr>
  <tr><td>Steering drift — a mob relaxed a root invariant locally</td><td>Invariant coverage check</td><td>M12</td></tr>

<p>Hold your incident reviews to this standard: name one of those, land the fix that week, with an owner. A review that produces a reminder has scheduled the same incident. And the operational argument for funding M16's provenance chain is here rather than in compliance — under incident it takes context-gathering from tens of minutes to a query.</p>
<p><em>Read the full module for:</em> how to keep an agent from asserting causation under time pressure, and what rollback means when three mobs have shipped on top of the suspect change.</p>
`,
  body:`
<p>This module is the payoff for M16. If you have not built the provenance chain, everything below is advice you cannot follow.</p>

<h3>The new failure mode, stated plainly</h3>
<p>Sev-2 at 02:40. Determinations are being auto-approved that should have gone to nurse review. The cause is somewhere in code that landed six weeks ago, and nobody on the call has read it. Not "nobody remembers the details" — nobody has read it, because it was generated, validated at the right tier by someone now asleep, and landed correctly.</p>
<p>Under sprints, someone always remembered. There was a person who had typed those lines, and finding them was a Slack message. At AI-DLC volume that person does not exist for most of the codebase, and this is not a hypothetical: it is the predictable consequence of the throughput this method delivers. <strong>Cold code</strong> is the term this course uses, and the honest framing for your organisation is that you have traded authorship memory for throughput, deliberately, and now need a mechanism to replace it.</p>

<h3>Provenance as an investigative tool</h3>
<div data-viz="mb_incident_timeline"></div>
<p>The chain from M16 — unit of work, mob, engine, validator, tier, steering version, gates passed — is not audit paperwork under incident conditions. It is the index. The query "which units of work in the last eight weeks touched the auto-approval path" replaces the forty minutes an on-call engineer would otherwise spend reading commit messages, and it replaces it with an answer that is complete rather than probable.</p>
<p>This reframing is the argument that funds the provenance work in the first place. Nobody approves an evidence-chain project on audit grounds alone; the operational case is stronger and it is the one to make: <strong>provenance-led investigation</strong> takes the median incident's context-gathering phase from tens of minutes to a query.</p>

<h3>Working with the agent under time pressure</h3>
<p>An agent reading unfamiliar code fast is genuinely excellent, which is exactly why the failure mode is dangerous: it is equally fluent when asserting causation it has not established. Under pressure, at 03:00, with three people watching a screen share, that fluency is very hard to resist.</p>
<p>Pick the unsupported claim:</p>

<div data-viz="mb_confabulation_tells"></div>

<p>The <strong>confabulation tell</strong>s worth internalising, all of them cheap to check:</p>
<ul>
  <li>A causal claim with no file reference, no stack frame, and no log line.</li>
  <li>A named configuration key, flag or property that sounds exactly right and does not exist.</li>
  <li>Correlation presented as mechanism: "this changed around then, so this caused it."</li>
  <li>Certainty that does not move when you supply contradicting evidence. A model that revises its story when shown a log line was reasoning; one that absorbs the contradiction without changing the conclusion was not.</li>
</ul>
<p>The discipline: <em>evidence per claim, or the claim is a hypothesis.</em> Write hypotheses in a list, mark each supported or unsupported, and do not let an unsupported one drive a rollback. Say it out loud on the call — it gives everyone else permission to ask too.</p>

<h3>Rolling back when three mobs have shipped on top</h3>
<div data-viz="mb_rollback_tree"></div>
<p>The suspect unit of work landed six weeks ago and eleven units of work from three mobs have landed on top of it, four of them touching the same files. A revert is not available in the sense people mean it.</p>
<table>
  <tr><th>Option</th><th>When it works</th><th>What it costs</th></tr>
  <tr><td>Flip the flag off</td><td>The change is behind a live flag — the reason M16's flag discipline matters at 03:00</td><td>Nothing. This is why you did it.</td></tr>
  <tr><td>Forward fix behind a new flag</td><td>Cause is understood and narrow</td><td>Another flag, which needs an owner and expiry even at 03:00</td></tr>
  <tr><td>Surgical revert of one unit of work</td><td>Stacked changes (M08) kept it independently revertible</td><td>Rebase risk on eleven subsequent changes; do it in the merge queue, not by hand</td></tr>
  <tr><td>Roll back the whole release</td><td>Nothing else works</td><td>Discards three mobs' correct work and buys a second incident on Monday</td></tr>
</table>
<p>When the change predates your flag discipline, and some will, the honest sequence is: mitigate at the edge — rate-limit the path, force everything to nurse review, accept the queue — then fix forward in daylight. Forcing all determinations to human review costs the SME queue dearly and is the correct trade at 03:00, because the failure mode you are stopping is wrong clinical outcomes.</p>

<h3>Postmortem without a scapegoat</h3>
<p>"The agent wrote it" is not a cause. It is a description of the tool, and a postmortem that stops there produces no system change and quietly teaches everyone to be more careful, which is not a control. The causes actually available to you, each one a system fix:</p>
<table>
  <tr><th>Cause</th><th>Fix</th><th>Module</th></tr>
  <tr><td>Tier misassignment — clinical logic reviewed as service-internal</td><td>Correct the tier table; add the evidence rule that prevents the class</td><td>M04</td></tr>
  <tr><td>Missing constraint — the invariant existed only as a sentence</td><td>Write the fitness function</td><td>M06</td></tr>
  <tr><td>Steering drift — a mob relaxed a root invariant locally</td><td>Invariant coverage check; contradiction scan</td><td>M12</td></tr>
  <tr><td>Boundary invisibility — the change crossed a repository nobody validated</td><td>Consumer-driven contract test in the provider pipeline</td><td>M09</td></tr>
  <tr><td>Evidence gap — you could not tell who validated it</td><td>Provenance v2 with validator identity</td><td>M16</td></tr>
</table>
<p>A <strong>systemic postmortem</strong> names one of those and lands the fix as a change, in the same week, with an owner. If your incident review produces a reminder rather than a commit, the same incident is scheduled.</p>

<div class="callout honest-limit">
  <div class="k">Honest limit — what provenance does not give you</div>
  <p>Provenance tells you what happened and who signed it. It does not tell you why the code is wrong, and it will not shorten the hard part of an incident — the reasoning about mechanism. Expect the chain to compress context-gathering substantially and diagnosis not at all. Selling it internally as a way to resolve incidents faster overall will produce a disappointed sponsor after the first genuinely hard Sev-2.</p>
  <p>Three further limits. <em>Cold code stays cold.</em> Nothing in this module gives you back the engineer who understood the module; the agent reading it at 03:00 is fast and has no history with the system, and for a subtle domain bug that history is exactly what would have helped. <em>The chain is only as good as its weakest field</em> — one unknown validator, as PD-7 produces, and the interesting question about a Tier 3 change becomes unanswerable at the moment you most need it. And <em>the discipline degrades under pressure precisely when it matters</em>: demanding evidence per claim is easy to write in a module and hard at 03:40 with an executive on the bridge. Assume it will slip, and make the slip cheap — a hypothesis list in the incident channel, written as you go, is the only version of this practice that survives a real night.</p>
</div>
`,

<p>These are the numbers you will be asked to produce, so it is worth knowing where each one comes from in your own pipeline — and what it costs you when someone games it.</p>
<table>
  <tr><th>Metric</th><th>Where it comes from</th><th>What gaming it looks like from the inside</th></tr>
  <tr><td>Bolts landed</td><td>Merge queue</td><td>Splitting units of work to inflate the count</td></tr>

  <tr><td>Contract breakages</td><td>Contract suite</td><td>Deleting the test that fails</td></tr>
  <tr><td>Cross-repo contract breakage</td><td>Drift report, consumer tests</td><td>Never writing the outcome test, so nothing can break</td></tr>

  <tr><td>Flag debt, by age</td><td>Flag registry</td><td>Renaming a flag resets its age</td></tr>

  <tr><td>Security queue depth</td><td>Security review records</td><td>Auto-approving dependency additions</td></tr>
</table>
<p>Two things to insist on when this arrives. Queue-time timestamps are yours to instrument and they are two fields — build them first, because that number is what argues for capacity on your behalf. And contention metrics must aggregate at platform level: the moment queue time is attributed to a named group, it stops being reported honestly, and you lose the earliest warning you have.</p>
<p><em>Read the full module for:</em> the cost-per-bolt arithmetic that argues against token quotas, and the four reasons a per-group ranking destroys the measurement it depends on.</p>

  body:`
<p>You will be asked three questions about this programme: is it working, what is it costing, and which group is doing best. The first two have good answers. The third has a correct refusal, and getting that refusal right is the most valuable thing in this module.</p>

<h3>Why the standard delivery metrics are not enough here</h3>
<p>Deployment frequency, lead time, change failure rate and time to restore are the right starting point and they measure flow through a system. They do not measure <em>contention for shared resources</em>, which is the thing that degrades when you add mobs to one platform. A platform can hold lead time flat for two quarters while validator queue time triples, and the four standard numbers will not show it until they collapse together.</p>
<p>So the portfolio set adds contention measurement. Eight numbers, each detecting one failure this course has described:</p>

<div data-viz="mb_eight_metrics"></div>

<table>
  <tr><th>Metric</th><th>Detects</th><th>Source</th><th>How it gets gamed</th></tr>
  <tr><td>Bolts landed</td><td>Whether governance has strangled delivery</td><td>Merge queue</td><td>Splitting units of work to inflate the count</td></tr>
  <tr><td>Validator queue time, by tier</td><td>The bottleneck, before it becomes visible in lead time</td><td>Review records</td><td>Not starting the clock until a validator picks it up</td></tr>
  <tr><td>Contract breakages</td><td>Cross-mob coordination failing inside one repository</td><td>Contract suite</td><td>Deleting the test that fails</td></tr>
  <tr><td>Cross-repo contract breakage</td><td>M09's silence — a consumer that stopped receiving changes</td><td>Drift report, consumer tests</td><td>Nobody writes the outcome test, so nothing ever breaks</td></tr>
  <tr><td>Steering drift events</td><td>Mob-local relaxation of a root invariant</td><td>Invariant coverage check, contradiction scan</td><td>Removing the invariant from the root list</td></tr>
  <tr><td>Flag debt, by age</td><td>Untested production configuration accumulating</td><td>Flag registry</td><td>Renaming a flag resets its age</td></tr>
  <tr><td>Evidence completeness</td><td>Whether you can answer an auditor without archaeology</td><td>Provenance records</td><td>Inferring fields instead of recording unknown</td></tr>
  <tr><td>Security queue depth</td><td>Supply-chain review being treated as a human gate</td><td>Security review records</td><td>Auto-approving Tier 2 dependency additions</td></tr>
</table>
<p>Publish the gaming column alongside the metric. Every one of these numbers has a cheap way to look better without being better, everyone knows it, and a metric set presented without its failure modes reads as naive to exactly the audience you need to convince.</p>

<h3>Cost governance, and the ratio nobody expects</h3>
<div data-viz="mb_cost_ratio"></div>
<p>Two costs per landed bolt. Token spend is measurable to the cent and rises visibly on a dashboard finance already watches. Validator hours are invisible, uncosted, and an order of magnitude larger.</p>
<table>
  <tr><th>Cost per landed bolt</th><th>Fixture figure</th><th>Notes</th></tr>
  <tr><td>Token spend</td><td>roughly 4 dollars</td><td>Varies by model and by how much context the bolt needed. Trending down per unit of work</td></tr>
  <tr><td>CI minutes</td><td>142 minutes</td><td>M10's number. Buyable, and worth buying</td></tr>
  <tr><td>Validator time</td><td>0.75 hours of a scarce clinician per Tier 3 bolt — about 0.1 hours averaged across everything landed</td><td>Still the dominant cost by a wide margin once you price an hour of clinical time against four dollars, and the only one with no purchase option</td></tr>
</table>
<p>The consequence for governance: <em>token quotas are the wrong control.</em> A quota that saves a few hundred dollars a month while causing one mob to skip the exploration that would have caught a contract break is a bad trade with a good-looking line item. What you want is visibility — spend per unit of work, visible to whichever mob spends it — plus an alert on anomalies rather than a cap. The finance conversation to have is not about reducing token spend; it is about how cheap token spend is relative to the review hours it can displace, which is M05's argument arriving in a budget meeting.</p>

<h3>The comparison trap</h3>
<div data-viz="mb_comparison_trap"></div>
<p>Someone senior will ask for a per-group ranking. It is a reasonable-sounding request and publishing it destroys the measurement you depend on, for four reasons that are worth having ready:</p>
<ol>
  <li><em>The hardest work looks worst.</em> Whichever group owns the clinical hotspot has the highest Tier 3 share and therefore the longest queue times. Ranking on cycle time ranks module difficulty, not capability.</li>
  <li><em>Rankings change behaviour immediately, and the cheapest behaviours are the harmful ones.</em> Split units of work smaller; classify a change one tier lower; start the review clock late. All three improve the number and worsen the platform.</li>
  <li><em>Queue time stops being reported honestly</em> the moment it is attributed. And queue time is the leading indicator this whole course rests on — losing it costs you the early warning in M19.</li>
  <li><em>It converts a shared problem into a competition.</em> Contention is a property of the platform. The groups that need to cooperate on a boundary contract now have a reason not to.</li>
</ol>
<blockquote>The rule: <em>contention metrics aggregate at platform level and are attributed to no group.</em> Per-group numbers exist, are visible to that group for its own use, and are never published upward or sideways.</blockquote>
<p>Two exceptions that hold up in practice. Metrics about <em>artifacts</em> rather than people can be attributed — an unowned module, an expired flag, a missing contract test are facts about the codebase and naming them creates no incentive to game. And a group may publish its own numbers voluntarily, which happens naturally once nobody is being ranked.</p>

<h3>Answering the ranking question without refusing to answer</h3>
<p>"Which group is performing best" cannot be answered honestly, but the question behind it usually can. What the executive wants is one of: are we getting value, where is the constraint, or is anyone in trouble. Offer those instead:</p>
<table>
  <tr><th>Instead of a ranking</th><th>Answer with</th></tr>
  <tr><td>Are we getting value?</td><td>Platform bolts landed and work-versus-wait split, quarter over quarter, with the contention story attached</td></tr>
  <tr><td>Where is the constraint?</td><td>Validator queue time by tier, and the encode-versus-review break-even for the top three recurring review comments</td></tr>
  <tr><td>Is anyone in trouble?</td><td>Yes, sometimes — brought as a specific request for help with a specific constraint, not as a position in a table</td></tr>
</table>
<p>M20 gives this the external-facing form, because the question arrives from outside engineering too and the version you give a board needs to be shorter and to survive being repeated without you.</p>

<h3>Build order for instrumentation</h3>
<ol>
  <li><em>Validator queue time.</em> Two timestamps per bolt. Cheapest, highest value, and the number that changes what you argue for.</li>
  <li><strong>Evidence completeness</strong>, once provenance records exist. A count of populated required fields.</li>
  <li><strong>Flag age</strong> and <strong>quarantined test age</strong>. Both are one query and both predict trouble a quarter out.</li>
  <li>Everything else, when the first three have changed a decision. A dashboard with eight numbers and no decisions attached becomes a wallpaper, and then a source of monthly argument.</li>
</ol>
`,
