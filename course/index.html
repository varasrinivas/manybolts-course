<style>
:root{

  --display:'Fraunces',Georgia,serif; --body:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --nav-w:288px; --maxw:760px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit}

/* ---------- layout ---------- */
.wrap{display:flex;min-height:100vh}
nav{width:var(--nav-w);flex:0 0 var(--nav-w);background:var(--paper-2);border-right:1px solid var(--rule);
    position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 0 40px}
main{flex:1;min-width:0;display:flex;justify-content:center;padding:44px 32px 96px}
.col{width:100%;max-width:var(--maxw)}

/* ---------- nav ---------- */
.brand{padding:0 20px 18px;border-bottom:1px solid var(--rule);margin-bottom:14px}
.brand h1{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.25;margin:0 0 4px;letter-spacing:-.01em}
.brand p{margin:0;font-size:12px;color:var(--muted);letter-spacing:.02em}
.filter{padding:12px 20px 14px;border-bottom:1px solid var(--rule);margin-bottom:10px}
.filter-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:7px}
.seg{display:flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;background:transparent;font-family:var(--body);font-size:12px;font-weight:500;
  padding:7px 4px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.track{margin:16px 0 4px;padding:0 20px}
.track-name{font-size:10px;text-transform:uppercase;letter-spacing:.11em;font-weight:600;color:var(--muted);
  display:flex;align-items:center;gap:7px}
.track-dot{width:7px;height:7px;border-radius:2px;flex:0 0 7px}
.nav-item{display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;border:0;background:transparent;
  font-family:var(--body);font-size:13.5px;line-height:1.4;color:var(--ink-2);padding:6px 20px 6px 20px;cursor:pointer}
.nav-item:hover{background:#0000000a}
.nav-item[aria-current="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.nav-item .id{font-family:var(--mono);font-size:11px;color:var(--muted);flex:0 0 30px}
.nav-item.is-empty .t{color:var(--muted);font-style:italic}
.nav-item.is-hidden{display:none}
.done{margin-left:auto;color:var(--ok);font-size:12px}
.sum{margin-left:auto;color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;
  border:1px solid var(--rule);border-radius:99px;padding:1px 6px;flex:0 0 auto}

/* ---------- module ---------- */
.eyebrow{display:flex;align-items:center;gap:10px;font-size:11px;text-transform:uppercase;letter-spacing:.11em;
  color:var(--muted);margin-bottom:10px}
.eyebrow .pill{border:1px solid var(--rule);border-radius:99px;padding:2px 9px;font-size:10px;letter-spacing:.06em}
h2.mod-title{font-family:var(--display);font-size:34px;line-height:1.14;font-weight:600;letter-spacing:-.02em;margin:0 0 8px}
.mod-meta{color:var(--muted);font-size:13px;margin-bottom:26px;font-family:var(--mono)}
.mod h3{font-family:var(--display);font-size:21px;font-weight:600;margin:34px 0 10px;letter-spacing:-.01em}
.mod h4{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:24px 0 8px}
.mod p{margin:0 0 14px}
.mod ul,.mod ol{margin:0 0 14px;padding-left:20px}
.mod li{margin-bottom:6px}
.mod strong{font-weight:600}
code{font-family:var(--mono);font-size:.88em;background:var(--paper-2);padding:1px 5px;border-radius:4px}
pre{font-family:var(--mono);font-size:12.5px;line-height:1.6;background:var(--card);border:1px solid var(--rule);
  border-radius:8px;padding:14px 16px;overflow-x:auto;margin:0 0 16px}
pre code{background:none;padding:0}
blockquote{margin:0 0 16px;padding:2px 0 2px 16px;border-left:2px solid var(--accent);color:var(--ink-2)}

.callout .k{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:5px}
.callout.honest-limit{border-left-color:var(--bad)}

th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}

.viz{margin:0 0 22px;border:1px solid var(--rule);border-radius:10px;background:var(--card);overflow:hidden}
.viz-body{padding:12px}
.viz svg{display:block;width:100%;height:auto}
.viz-cap{font-size:12px;color:var(--muted);padding:0 14px 11px}
.viz-ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--rule);

.viz-ctl label{display:flex;align-items:center;gap:7px;color:var(--muted)}
.viz-ctl output{font-family:var(--mono);color:var(--ink);font-weight:500}
input[type=range]{accent-color:var(--accent)}

/* ---------- lab ---------- */
.lab{border:1px solid var(--rule);border-radius:10px;background:var(--card);margin:26px 0 20px;overflow:hidden}
.lab-head{padding:13px 16px;border-bottom:1px solid var(--rule);background:var(--paper-2);

.lab-head .k{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}
.lab-head .n{font-family:var(--display);font-size:16px;font-weight:600}
.pd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--rule);border-radius:99px;padding:2px 8px;color:var(--muted)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule)}
.tabs button{border:0;background:transparent;font-family:var(--body);font-size:12.5px;font-weight:500;color:var(--muted);
  padding:9px 15px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.lab-body{padding:15px 16px}
.lab-body[hidden]{display:none}

/* ---------- footer nav ---------- */
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:44px;padding-top:20px;border-top:1px solid var(--rule)}
.pager button{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:9px 15px;
  font-family:var(--body);font-size:13px;cursor:pointer;color:var(--ink)}
.pager button:disabled{opacity:.4;cursor:default}
.pager button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mark{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:9px 15px;
  font-family:var(--body);font-size:13px;cursor:pointer}
.mark[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}

.empty{color:var(--muted);font-style:italic;border:1px dashed var(--rule);border-radius:10px;padding:28px;text-align:center}

  nav{width:100%;flex:none;position:static;height:auto;max-height:none;border-right:0;border-bottom:1px solid var(--rule)}
  main{padding:28px 18px 72px}
  h2.mod-title{font-size:27px}
  /* wide content scrolls inside itself; the page body never scrolls sideways */
  .mod table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .mod code{overflow-wrap:anywhere}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<h3>The unit of analysis is the platform</h3>
<p>Every other treatment of this method takes the team as the unit: one mob, one intent, one loop. That framing works exactly until a second mob shares your trunk, your reviewer, and your pipeline. Then the interesting variable is no longer how fast a mob works — it is how much of the platform each mob has to wait for.</p>
<p>So the object of study here is the shared thing: the codebase, the validator, the environment. The mobs are load.</p>

<div data-viz="mb_repo_topology"></div>

<p>Three repositories, and the awkward one is at the bottom. <code>priorauth-clinical-rules</code> is consumed by both services and owned by neither. Every change to it needs clinical review; no mob has clinical capacity of its own. Hold that discomfort — M02 names it, M05 resolves it, and M15 explains why it produced the code it did.</p>
<div class="callout">
  <div class="k">Where the third repository does and does not matter</div>
  <p style="margin:0">Worth setting expectations, because the fixture was play-tested for exactly this. In the first two rounds of the simulation, nothing about the third repository hurts: every collision you meet is inside <code>priorauth-api</code> — the same file, the same enum, the same migration version. The multi-repo damage in those rounds is real and completely silent, which is why round 2 now asks you to go and check for it rather than waiting for a build to tell you. The third repository starts costing you visibly in M09, M11 and M15, and it becomes an incident in round 4. If you are looking for the argument that repository topology matters, it is there, and it is not in week one.</p>
</div>

<h3>The course in one screen</h3>
<div data-viz="mb_course_map"></div>
<p>Twenty-two modules, six tracks. Budget <em>about 25 hours of reading and labs plus a 2–3 hour capstone</em> — the per-module timings in each header add up to that, and they assume the fixture already builds. The filled chips are the spine: if this had to shrink to eight modules, those eight survive. Read them in order and you have the argument end to end.</p>

<p>No cloud account, no licence beyond your engine, and nothing to install for the player itself.</p>

<p>The fixture is one repository that carries the intents, governance templates, round scripts and evidence, and pulls the three service repositories in beside them. Clone and verify it now — a broken fixture discovered in the middle of M04 costs more than ten minutes of setup.</p>
<pre><code>git clone &lt;host&gt;/platform-fixture
cd platform-fixture
./scripts/setup.sh          # clones priorauth-api, priorauth-web,

./scripts/verify-fixture.sh # all three build; round-1 branches apply</code></pre>
<p>After that you have <code>platform-fixture/repos/</code> for the three services, and <code>intents/</code>, <code>governance/</code>, <code>registry/</code>, <code>evidence/</code>, <code>branches/</code>, <code>scripts/</code> and an empty <code>records/</code> for the artifacts you produce. Every lab path in this course is relative to <code>platform-fixture/</code>.</p>

<p>The sidebar filter has two settings beyond All. <em>Leader</em> shows the modules about capacity, cost, evidence, and rollout sequencing. <em>Builder</em> shows the mechanics: trunk, CI, contracts, brownfield. Several modules appear in both with different emphasis — M04 and M05 in particular, because the validation economy is simultaneously a staffing decision and a merge-queue decision.</p>
<p>If you are a director reading the Builder track anyway, you will be fine. If you are an engineer skipping the Leader modules, you will lose the argument in M20 that you will eventually be asked to make.</p>

<h3>How the capstone is scored, and why speed alone loses</h3>
<p>M21 is <strong>The Quarter</strong>: six timed rounds, three mobs, one platform, one injected event per round. You play platform lead — you do not write the features. Eight scored dimensions:</p>
<table>

<p>The rubric is visible from round 1, deliberately. <strong>A run that lands everything fast and fails round 5 scores below a slower run that keeps its evidence.</strong> Any scoring scheme that rewards throughput alone would teach the opposite of this course.</p>

<h3>What this course does not do</h3>

<p>Every example in this course is drawn from one platform. Learn it once here and the later modules can be short.</p>

<h3>Prior authorisation in five minutes</h3>
<p>A provider wants to perform a procedure. Before the payer agrees to pay, someone has to decide whether it meets clinical criteria. That decision is a <strong>prior authorisation</strong>, and the discipline around it is utilisation management: approve what is indicated, review what is not obviously indicated, and be able to explain either afterwards.</p>
<p>MeridianCare runs that decision as software. An <code>AuthRequest</code> arrives with a <code>Member</code>, a <code>Provider</code>, and a procedure code. The service evaluates it against <code>ClinicalCriteria</code> and produces a confidence score. Above <code>AUTO_APPROVE_THRESHOLD = 0.85</code> it issues a <code>Determination</code> automatically. Below it, the request lands in the <strong>nurse review queue</strong>, where a clinician decides.</p>

<div data-viz="mb_domain_flow"></div>

<p>Two facts about that queue matter for the rest of the course, and both are numbers you should hold on to:</p>
<table>
  <tr><th>Fact</th><th>Value in the fixture</th><th>Why it matters here</th></tr>
  <tr><td>Median nurse review time</td><td>11 minutes per request</td><td>Queue capacity is a headcount decision, not a software one.</td></tr>
  <tr><td>Requests routed to review</td><td>31% of volume</td><td>Moving the threshold moves clinical risk, not just throughput.</td></tr>
  <tr><td>Regulatory turnaround for a standard request</td><td>14 calendar days</td><td>The queue has a hard deadline attached to it.</td></tr>
</table>
<p>Notice the shape of that queue: many items, one class of scarce expert, a deadline. Hold it in mind, because in M04 the same shape appears one level up — the mobs are the requests and the clinical SME is the nurse. <code>AUTO_APPROVE_THRESHOLD</code> is not just domain trivia. It is a working example of routing work to a human only above a risk threshold, which is exactly the mechanism M04 applies to code review.</p>

<h3>Three repositories, and one of them is a problem</h3>
<div data-viz="mb_repo_topology"></div>
<table>
  <tr><th>Repo</th><th>Contains</th><th>Owns</th></tr>
  <tr><td><code>priorauth-api</code></td><td>Spring Boot service, <code>DeterminationService</code>, <code>EligibilityService</code>, Flyway migrations, audit writes</td><td><code>Determination</code> and <code>AuthStatus</code>. The only writer.</td></tr>

<p>M05 assigns it an owner. M09 shows what that version gap silently destroys. M15 explains why an unowned module ends up with the design it has. Until then, it stays uncomfortable.</p>
<p>One expectation to set now, from play-testing the fixture: this will not hurt you soon. For the first fortnight the unowned library and the version gap produce no failing test, no red build and no alarm of any kind. That is the property that makes them dangerous rather than annoying, and it is why the practices that catch them — a contract test in the provider's pipeline, a version-drift report, an owner with hours attached — have to be built before there is any evidence you need them.</p>

<h3>Five mobs, one trunk</h3>
<div data-viz="mb_mob_charters"></div>
<p>Three mobs have bolts in flight and appear in almost every lab. Two exist to make the platform realistic — a fourth arrives mid-quarter in M19, and the fifth is the one whose work you keep deferring.</p>
<p>Every pair of active mobs collides, deliberately: Appeals and Gate both write <code>AuthStatus</code> transitions; Gate and Portal both decide how a denial reason is worded; Portal and Appeals both add surfaces to the same queue screen. Pairwise collision is instructive. The three-way collision is the capstone.</p>

<h3>The constraints that do not move</h3>
<table>
  <tr><th>Constraint</th><th>Detail</th><th>Contention class</th></tr>

  <tr><td>HIPAA and PHI boundaries</td><td>Any path touching member data is audit-relevant and cannot be delegated away</td><td>validator</td></tr>
  <tr><td>One trunk per repo</td><td>No long-lived branches; wide agent diffs land on top of each other</td><td>code</td></tr>

<p>None of these are unusual, and none of them are what a pilot mob experiences. A pilot gets the SME's attention on demand and an empty CI queue, because there is nobody else in line. That difference — not the method, not the tooling — is what M19 calls the second-team cliff.</p>

<h3>Tuesday, week two of the rollout</h3>
<p>Gate finishes a bolt at 10:40 — criteria-specific thresholds, twelve files, tests green. It needs the clinical SME, who is in nurse escalations until Thursday. Appeals finishes at 11:15 and lands first, because their change looked smaller. Gate rebases at 14:00 onto a schema Appeals just changed, and the agent resolves the conflict plausibly and wrongly. Portal, meanwhile, has been waiting since Monday for the UAT environment, which Appeals is holding for a demo.</p>
<p>Three mobs, three good bolts, one platform. Nobody did anything wrong and the week produced one landed change. This is the failure mode the course exists for, and none of it is visible from inside a single mob.</p>

<h3>Contention has exactly three classes</h3>
<p>Every delay above belongs to one of three classes. This taxonomy is the course's organising device: it is worth being able to recite, because the correct response differs by class and the classes get confused constantly.</p>

<div data-viz="mb_contention_classes"></div>

<table>
  <tr><th>Class</th><th>The shared resource</th><th>Measure it as</th><th>Response track</th></tr>
  <tr><td><strong>code contention</strong></td><td>Files, aggregates, migrations, the trunk itself</td><td>Rebase count per landed bolt; diff overlap between in-flight bolts</td><td>Track 2 mechanics, Track 3 artifacts</td></tr>
  <tr><td><strong>validator contention</strong></td><td>The scarce human who must say yes</td><td>Queue time as a share of bolt cycle time</td><td>Track 1 — the spine of this course</td></tr>
  <tr><td><strong>infrastructure contention</strong></td><td>CI runners, UAT, test data, seats, tokens</td><td>Wait-for-resource time per bolt; pipeline queue depth</td><td>M10</td></tr>
</table>
<p>Two of these three are familiar problems that agents made worse. Only one of them is new, and it is the one nobody instrumented: nothing in a standard delivery dashboard measures how long a change waited for a person, as distinct from how long it took to make.</p>

<h3>The number that actually moves</h3>
<p>Here is the same four-bolt workload run through the fixture harness at one, three and five mobs. Generation capacity is identical in all three. Only the arrival rate against shared resources changes.</p>

<div data-viz="mb_cycletime_regression"></div>

<p>Working time is flat, as it should be — the agents did not get slower. Cycle time is 3.7 times longer at five mobs, and all of that increase is waiting. This is the regression that gets reported upward as <em>the AI thing is not working</em>, and reported sideways as <em>the platform team is blocking us</em>, and it is neither.</p>
<p>The measurement discipline that follows is unglamorous and cheap: split every bolt's cycle time into <strong>work time</strong> and <strong>queue time</strong>, and attribute the queue time to one of the three classes. You can do it in a spreadsheet for two weeks and it will change what you argue for.</p>

<h3>Where the published method is silent</h3>
<p>Be precise about this, because overstating it invites a fair rebuttal. The method is not wrong. It is scoped to a mob, it says so, and at that scope it works. What it does not contain is any mechanism for arbitration between mobs.</p>

<div data-viz="mb_method_gap"></div>

<table>
  <tr><th>The method defines</th><th>It does not define</th><th>Addressed in</th></tr>
  <tr><td>Mob Elaboration for one mob</td><td>How two mobs elaborating the same domain reconcile before they build</td><td>M14</td></tr>
  <tr><td>A human validation checkpoint</td><td>What happens when arrivals exceed one validator's capacity — no queue model, no tiering, no capacity concept</td><td>M04, M05</td></tr>
  <tr><td>That the mob reviews the code</td><td>Which repository the code is in, or what to do when the change crosses one at multi-mob scale</td><td>M09</td></tr>
  <tr><td>Steering files as team convention</td><td>Precedence between five mobs' steering files, and how to detect divergence</td><td>M12, M13</td></tr>
  <tr><td>Bolts landing on trunk</td><td>Serialisation when six wide diffs arrive in an afternoon</td><td>M08, M10</td></tr>
  <tr><td>Traceability of a unit of work</td><td>Provenance across mobs, engines and validators, as audit evidence</td><td>M16</td></tr>
</table>
<p>Anyone who tells you the published method answers the right-hand column has not run it with five mobs. The honest framing for your own leadership: <em>the method is a mob-level method; platform-level arbitration is ours to build, and here is what it costs.</em></p>

<h3>Why adding mobs does not add throughput</h3>
<p>Two pieces of standard queueing arithmetic explain most of the chart above, and both are worth having at hand when someone proposes solving this with more mobs.</p>
<ul>
  <li><em>Little's law.</em> Work in progress equals throughput multiplied by cycle time. Add mobs without adding validation capacity and you have raised work in progress; since throughput is capped by the validator, cycle time is the only variable left to absorb it.</li>
  <li><em>Utilisation and queue time.</em> For a single server, queue time rises non-linearly with utilisation and becomes unbounded as it approaches capacity. A validator at 95% utilisation is not 15% worse than one at 80%; the queue behind them is several times longer.</li>
</ul>

<div class="callout">
  <div class="k">Where this model is an approximation</div>
  <p style="margin:0">Reviews are not a tidy single-server queue. They arrive in bursts, get batched, jump the line for politics, and are sometimes done badly under pressure — which produces rework, a feedback loop the arithmetic above does not capture. Use the model to predict direction and rough magnitude, never to promise a number. If you present a queueing chart to executives, present it as an argument for measuring, not as a forecast.</p>
</div>

<h3>Three cheap moves, this week</h3>
<ol>
  <li><em>Instrument queue time.</em> One field per bolt: when it became ready for validation, when validation started. Nothing else changes yet.</li>
  <li><em>Inventory your contention</em> in the three classes, which is this module's lab. Most platforms discover an infrastructure constraint they had stopped noticing.</li>
  <li><em>Stop routing everything to the scarcest human.</em> That is M04, and it is the single highest-leverage change available to most platforms.</li>
</ol>
`,

{
  id:'M04',
  title:'The validation bottleneck under load',
  track:1,
  audience:['leader','practitioner'],
  contentionClass:['validator'],
  duration:'45 min · 40 min lab',
  visuals:['mb_queue_curve','mb_tier_ladder','mb_sme_load'],
  mount(host){
    const arr = host.querySelector('[data-mb="q-arr"]');
    const cap = host.querySelector('[data-mb="q-cap"]');
    if (!arr || !cap) return;
    const dot = host.querySelector('[data-mb="q-dot"]');
    const outA = host.querySelector('[data-mb="q-arr-out"]');
    const outC = host.querySelector('[data-mb="q-cap-out"]');
    const read = host.querySelector('[data-mb="q-read"]');
    const SERVICE = 0.75;
    const upd = function(){
      const a = Number(arr.value), c = Number(cap.value);
      const rho = Math.min(0.985, (a * SERVICE) / c);
      const x = 70 + rho * 560;
      const wq = SERVICE * rho / (1 - rho);
      const y = 200 - Math.min(178, (wq / 18) * 178);
      if (dot){ dot.setAttribute('cx', x.toFixed(1)); dot.setAttribute('cy', y.toFixed(1)); }
      if (outA) outA.textContent = a + ' bolts/week';
      if (outC) outC.textContent = c + ' review hours/week';
      if (read){
        const u = Math.round(rho * 100);
        const txt = rho >= 0.98 ? 'utilisation ' + u + '% — queue grows without bound; bolts age until someone escalates'
          : 'utilisation ' + u + '% — expected wait ' + wq.toFixed(1) + ' h per bolt (' + (wq / SERVICE).toFixed(1) + ' review-lengths of pure waiting)';
        read.textContent = txt;
      }
    };
    arr.addEventListener('input', upd);
    cap.addEventListener('input', upd);
    upd();
  },
  body:`
<p>This is the keystone module. If you take one thing from the course, take this: the <strong>validation bottleneck</strong> is a shared resource, and the moment a second mob touches the same codebase, the method stops being a workflow question and becomes a capacity question.</p>

<h3>The gap that opened</h3>
<p>Agents changed one side of a two-sided system. Generation capacity per engineer rose; the capacity to decide whether generated code is correct and safe did not move at all, because it is bounded by the number of people who are allowed to make that decision.</p>
<p>Be careful how you quantify this in public. The published evidence is genuinely mixed: the 2025 DORA report describes throughput gains arriving together with stability regressions where review practice did not change, and METR's randomised trial of experienced developers working in their own repositories found tasks took longer with AI assistance while the developers believed they had been faster. What is not in dispute, and what you can measure on your own platform this month, is that <strong>generated diff volume per engineer went up and the number of people qualified to approve a clinical change did not</strong>.</p>
<p>That is the <strong>generation–validation throughput gap</strong>, and at one mob it is invisible: one mob cannot generate enough to saturate one reviewer.</p>

<h3>What utilisation does to queue time</h3>
<p>Move the sliders. Arrival rate is bolts per week needing clinical validation; capacity is the SME hours actually available for review — not their contracted hours, the hours left after nurse escalations and the Thursday board.</p>

<div data-viz="mb_queue_curve"></div>

<p>The shape is the point. Nothing dramatic happens between 40% and 70% utilisation, which is why pilots feel fine. Past roughly 80% the curve turns and each additional bolt costs the whole queue. Two consequences worth stating to leadership plainly:</p>
<ul>
  <li>A validator you have loaded to 95% is not "nearly at capacity". They are the reason cycle time tripled.</li>
  <li>Adding a mob adds arrivals. If validation capacity is unchanged, you have not added throughput — you have added <strong>queue time</strong>, which then gets reported as a tooling failure.</li>
</ul>

<h3>Where the week actually goes</h3>
<div data-viz="mb_sme_load"></div>
<p>The fixture's clinical SME is 0.6 FTE, which everyone rounds to "available". Of 24 nominal hours, 9 go to nurse escalations that cannot be deferred, 3 to the Thursday board, 4 to meetings and context switching. Roughly <em>8 hours a week</em> remain for validating code — about ten bolts at 45 minutes each, if none of them require a second pass. Three mobs at four bolts a week each generate twelve.</p>
<p>Read that as the <em>untiered</em> platform, because that is what most platforms are: every change goes to the person who is allowed to approve anything. Twelve arrivals against ten slots is not a small overshoot — it is utilisation above 100%, the runaway end of the curve above, and it is why the queue grows rather than settles. The arithmetic was never going to work, and no amount of prompt engineering changes it.</p>
<p>Hold on to those two numbers. The next section cuts the arrivals instead of raising the capacity, and the gap between twelve arrivals and what actually needs a clinician is the whole of Track 1.</p>

<h3>The delegation ladder</h3>
<p>The first correct response is not to add validators. It is to stop sending everything to the scarcest one. Classify by <strong>blast-radius tier</strong> — what breaks, and who is harmed, if this change is wrong.</p>

<div data-viz="mb_tier_ladder"></div>

<p>The share in that last column is what turns the arithmetic around. Twelve bolts a week at 13% Tier 3 is 1.6 changes needing a clinician — 1.2 hours against the 8 the SME has. <strong>Tiering alone takes this platform from 150% validator utilisation to about 15%.</strong> Which raises the obvious question, and it is the right one to be sceptical about: if it is that easy, why is anyone stuck? Three reasons, and you will meet all three. Tiering is a judgement call that goes wrong in the direction of PD-2 below. Tier 3 work grows as clinical surface grows, so the 13% is not a constant. And a mob that cannot get a Tier 2 review will escalate to Tier 3 to get an answer at all, which quietly refills the queue you just emptied.</p>

<table>
  <tr><th>Tier</th><th>Scope</th><th>Validator</th><th>Fixture examples</th></tr>
  <tr><td>0</td><td>Cosmetic, test-only, docs, formatting</td><td>Agent plus author</td><td>Nurse queue column widths; test naming</td></tr>
  <tr><td>1</td><td>Service-internal logic, no external contract</td><td>Peer inside the mob</td><td>Appeals' internal state machine helper</td></tr>
  <tr><td>2</td><td>Published contract, cross-team surface, shared aggregate</td><td>Owning mob's designated validator</td><td>The determination response payload; a component library change</td></tr>
  <tr><td>3</td><td>Clinical rule, threshold constant, PHI path, audit surface</td><td>Clinical SME and compliance. <em>No delegation.</em></td><td>Anything reading AUTO_APPROVE_THRESHOLD; criteria evaluation; audit writes</td></tr>
</table>

<div class="callout">
  <div class="k">You have already built this ladder once</div>
  <p style="margin:0">This is <code>AUTO_APPROVE_THRESHOLD</code> applied to code review. Your platform already routes clinical decisions to a scarce expert only when confidence is below a threshold and the consequence of being wrong is material; everything above the line is decided automatically and audited afterwards. Tiering review is the same mechanism with the same failure mode — set the threshold wrong and you either drown the expert or ship something you should not have. When you explain tiering to a risk officer, use their own auto-approval rule as the analogy. It moves the conversation faster than any argument about agents.</p>
</div>

<h3>PD-2: the tier that looks one level lower than it is</h3>
<p><code>ClinicalCriteriaEvaluator</code> in <code>priorauth-clinical-rules</code> reads like service-internal logic. It has no PHI in its signature, no audit call, and its tests look like unit tests over plain data. It is Tier 3: it decides whether a member's procedure is clinically indicated, and a wrong change to it produces wrong determinations that nobody detects, because the output is plausible.</p>
<p>An agent asked to tier the repositories will put it at Tier 1 with a confident justification, and a reviewer skimming the table will accept it. This is the single most expensive mistake in the tiering exercise, and it is planted deliberately in the lab below. <em>Tier by what code decides, never by what it imports.</em></p>

<h3>Five responses, in the order most platforms should try them</h3>
<table>
  <tr><th>Response</th><th>What it buys</th><th>What it costs</th></tr>
  <tr><td>1. Tier by blast radius</td><td>On this platform 87% of changes leave the scarce queue immediately — twelve weekly arrivals become about 1.6, or 1.2 hours against 8 available. Plan on 60–75% until you have measured your own</td><td>Real judgement, and the risk of the PD-2 mistake at scale</td></tr>
  <tr><td>2. Reduce arrival rate</td><td>Fewer, larger validated units instead of many small ones</td><td>Bigger diffs, later feedback, worse rollback granularity</td></tr>
  <tr><td>3. Asynchronous review with a stated SLA</td><td>Predictability; mobs can plan around a 24-hour promise</td><td><strong>Review SLA</strong> only helps if you measure the actual against it</td></tr>
  <tr><td>4. Add validators</td><td>Linear capacity increase</td><td>Linear cost, months of ramp, and clinical validators may simply not exist to hire</td></tr>
  <tr><td>5. Make the validation unnecessary</td><td>Non-linear: one encoded rule consumes zero validator time per bolt, forever</td><td>Up-front SME time, and it only works for rules that can be encoded</td></tr>
</table>
<p>Responses 1 through 4 are all variations on managing a queue. The fifth changes the arithmetic, and it is the one this course argues for: <strong>capacity multiplier</strong> work, where an hour of SME time spent encoding a rule replaces an hour of review on every future bolt rather than one. That is M05, and it is the treatment for the diagnosis you have just read.</p>
`,

    pd:['PD-2'],

<p><em>Deliverable:</em> <code>platform-fixture/governance/VALIDATION_TIERS.md</code> covering every package in all three repositories, plus a generated <code>.github/CODEOWNERS</code> per repo, plus a one-paragraph note on what the tiering does to the SME's weekly load using this module's arithmetic.</p>

{
  id:'M05',
  title:'Platform teams as validator-capacity multipliers',
  track:1,
  audience:['leader','practitioner'],
  contentionClass:['validator'],
  duration:'45 min · 40 min lab',
  visuals:['mb_capacity_math','mb_golden_path','mb_ownership_models','mb_platform_bottleneck'],
  mount(host){
    const enc = host.querySelector('[data-mb="c-enc"]');
    const mob = host.querySelector('[data-mb="c-mob"]');
    const reu = host.querySelector('[data-mb="c-reu"]');
    if (!enc || !mob || !reu) return;
    const lineR = host.querySelector('[data-mb="c-review"]');
    const lineE = host.querySelector('[data-mb="c-encode"]');
    const mark = host.querySelector('[data-mb="c-mark"]');
    const read = host.querySelector('[data-mb="c-read"]');
    const outs = {
      enc: host.querySelector('[data-mb="c-enc-out"]'),
      mob: host.querySelector('[data-mb="c-mob-out"]'),
      reu: host.querySelector('[data-mb="c-reu-out"]')
    };
    const X0 = 70, X1 = 650, Y0 = 196, YMAX = 60, WEEKS = 12;
    const px = function(w){ return X0 + (w / WEEKS) * (X1 - X0); };
    const py = function(h){ return Y0 - Math.min(1, h / YMAX) * (Y0 - 24); };
    const upd = function(){
      const E = Number(enc.value), M = Number(mob.value), R = Number(reu.value) / 100;
      const weekly = M * 4 * R * 0.75;
      const upkeep = E * 0.025;
      let dR = '', dE = '';
      for (let w = 0; w <= WEEKS; w++){
        dR += (w ? 'L' : 'M') + px(w).toFixed(1) + ' ' + py(weekly * w).toFixed(1) + ' ';
        dE += (w ? 'L' : 'M') + px(w).toFixed(1) + ' ' + py(E + upkeep * w).toFixed(1) + ' ';
      }
      if (lineR) lineR.setAttribute('d', dR);
      if (lineE) lineE.setAttribute('d', dE);
      const net = weekly - upkeep;
      const be = net > 0 ? E / net : Infinity;
      if (mark){
        const on = be <= WEEKS;
        mark.setAttribute('opacity', on ? '1' : '0');
        if (on){ mark.setAttribute('cx', px(be).toFixed(1)); mark.setAttribute('cy', py(weekly * be).toFixed(1)); }
      }
      if (outs.enc) outs.enc.textContent = E + ' SME hours to encode';
      if (outs.mob) outs.mob.textContent = M + (M === 1 ? ' mob' : ' mobs');
      if (outs.reu) outs.reu.textContent = Number(reu.value) + '% of bolts touch the rule';
      if (read){
        read.textContent = net <= 0 ? 'no break-even — upkeep costs more than the review it saves; leave this one at Tier 3'
          : be <= WEEKS ? 'break-even at week ' + be.toFixed(1) + ' · saves ' + (weekly - upkeep).toFixed(1) + ' SME hours every week after that'
          : 'break-even at week ' + be.toFixed(1) + ' — beyond a quarter, so encode only if the rule will outlive the mobs';
      }
    };
    [enc, mob, reu].forEach(function(el){ el.addEventListener('input', upd); });
    upd();
  },
  body:`
<p>M04 was the diagnosis. This is the treatment, and it is the one response that changes the arithmetic instead of managing it.</p>

<h3>The fifth response: make the validation unnecessary</h3>
<p>Four of M04's responses manage a queue: tier it, slow the arrivals, promise a turnaround, hire another server. All four leave the underlying relationship intact — each bolt still consumes some scarce human attention, so cost scales with bolt count forever.</p>
<p>The fifth breaks that relationship. A rule expressed as a constraint the agent must satisfy — a fitness test, a scaffold default, a steering invariant with a check behind it — consumes SME time <em>once</em> and then costs nothing per bolt. That is what a <strong>capacity multiplier</strong> is: not a faster reviewer, but a rule that no longer needs reviewing.</p>
<p>This is the honest justification for a platform team in an AI-DLC estate, and it is a different justification from the usual one. The platform team is not there to build shared tooling. It is there to convert scarce human judgement into mechanical checks, and its output is measured in validator hours returned per quarter.</p>

<h3>The economics, worked</h3>
<p>The argument has to be numeric or it is just a preference. Encoding a rule costs SME hours up front and a small upkeep. Reviewing against it costs a fraction of an SME hour per bolt, every bolt, forever. Move the sliders to find where the crossover sits on your platform.</p>

<div data-viz="mb_capacity_math"></div>

<p>Three readings worth taking from that model:</p>
<ul>
  <li><em>At one mob, encoding rarely pays inside a quarter.</em> This is why pilots do not build golden paths, and why the pilot team's advice does not transfer. Their arithmetic genuinely said no.</li>
  <li><em>At five mobs, most encodable rules break even inside two weeks.</em> The same rule, the same cost, five times the reuse.</li>
  <li><em>Reuse dominates.</em> A rule that applies to 20% of bolts is usually not worth encoding; one that applies to 80% almost always is. Ask what fraction of bolts touch the rule before you argue about the hours.</li>
</ul>
<p>That is the <strong>encode-vs-review break-even</strong>, and it is the sentence to take into a staffing conversation: <em>at our mob count, an SME hour spent encoding returns four to six review hours per quarter; an SME hour spent reviewing returns nothing next quarter.</em></p>

<h3>Golden paths are scaffolds, not wiki pages</h3>
<p>A <strong>golden path</strong> is not documentation that describes the right way. It is a generated starting point where the invariants are already satisfied, so no mob can forget what was never optional.</p>

<div data-viz="mb_golden_path"></div>

<p>Concretely, in this platform: a new endpoint that touches member data is scaffolded with the <code>@PhiBoundary</code> annotation present, the audit write wired, the PHI-logging fitness test committed, and the criteria call routed through the shared evaluator rather than reimplemented. A mob starts from a change that already passes the four checks a clinical reviewer would have asked about. What remains for the SME is the part that is actually clinical judgement.</p>
<pre><code>platform/scaffolds/phi-endpoint/
  Controller.java.tmpl        # @PhiBoundary present, not optional
  AuditWrite.java.tmpl        # audit record written before response
  PhiLoggingFitnessTest.java  # fails if a member identifier reaches a log
  README.md                   # what you may change, and what you may not</code></pre>
<p>The test is the load-bearing file. A scaffold without an executable check is a template, and templates decay the first time someone is in a hurry.</p>

<h3>PD-8: the library nobody owns</h3>
<p><code>priorauth-clinical-rules</code> is consumed by three mobs and owned by none. Every change to it is clinically material, so every change needs the SME; no mob has clinical capacity of its own; changes queue behind whichever mob happened to need one first. Meanwhile its design drifts, because three mobs' idioms have been layered on it without an editor.</p>

<div data-viz="mb_ownership_models"></div>

<table>
  <tr><th>Model</th><th>How it works</th><th>Honest cost</th></tr>
  <tr><td>Owning mob</td><td>One mob takes the library into its charter and reviews all changes to it</td><td>That mob becomes a service desk for the other two, and its own roadmap slips. Works only if the library is mostly theirs.</td></tr>
  <tr><td>Platform team owns it</td><td>The platform team maintains and reviews the library</td><td>Recreates the SME queue one layer down unless the platform team owns constraints rather than changes. See the anti-pattern below.</td></tr>
  <tr><td>Inner-source with designated maintainers</td><td>Any mob may change it; two named maintainers review; the criteria tests are the contract</td><td>Requires real maintainer time — 4 to 6 hours a week that someone must actually have — and it fails silently when maintainers are also the busiest engineers.</td></tr>
</table>
<p>For this platform the defensible answer is inner-source with designated maintainers, one of whom is the clinical SME, <em>plus</em> a hard requirement that criteria changes come with a criteria test. That combination is what makes most changes reviewable by a non-clinician: the clinical question becomes "is this test right?", which is a question the SME can answer in minutes rather than reading a diff.</p>

<h3>When the platform team becomes the new bottleneck</h3>
<div data-viz="mb_platform_bottleneck"></div>
<p>The failure is easy to diagnose and hard to admit: mobs are waiting on platform. It happens when the platform team starts reviewing changes instead of encoding rules, usually for good reasons — they know the system best, and the first few reviews are genuinely faster.</p>
<blockquote>The rule that prevents it: <em>platform owns constraints and scaffolds, never the change itself.</em> A platform team that reviews changes has recreated the SME queue with extra steps and a worse claim to authority.</blockquote>
<p>The measurable version: if platform review appears in the critical path of more than one mob's bolts, the platform team is a validator, not a multiplier. Track it the same way you track SME queue time — that number is what tells you before the mobs do.</p>

<h3>Staffing this honestly</h3>
<p>What it costs, in the fixture's terms: two engineers and a fraction of the SME, for one quarter, to produce the tier definitions, two scaffolds, the fitness function suite, and the merge queue. That is not free and it is not a rounding error on a five-mob programme.</p>
<p>One observation from every rollout that worked: <em>the first platform hire is usually the SME who was drowning.</em> Not a new person — the existing bottleneck, moved from reviewing to encoding, with their review load explicitly reduced to make room. If you cannot free them, you have not funded the platform team; you have added a job title to someone who is already the constraint.</p>

<div class="callout honest-limit">
  <div class="k">Honest limit — where this stops working</div>
  <p>Encoding only reaches rules you can state. A constraint is an executable sentence, and the moment a rule needs the words "depends on the clinical picture", there is nothing to execute. In the fixture, roughly a third of the SME's recurring review comments are genuinely unencodable — not because nobody tried, but because the judgement is the work. Those stay at Tier 3 permanently, and a platform team that tries to encode them ships constraints that are subtly wrong and now trusted, which is worse than the queue.</p>
  <p>Three further limits, stated plainly. <em>The break-even model assumes reuse holds</em> — rules decay as the domain changes, and a rule encoded for a criteria set that gets replaced next quarter was a loss. <em>Constraints catch only what you thought of</em>, so encoding shifts risk from "reviewed badly" to "never considered", which is harder to notice and does not appear in any queue metric. And <em>the platform team's own capacity is finite</em>: it has a utilisation curve exactly like the SME's, and at high utilisation it produces the same non-linear queue this module claims to solve. Encoding raises the ceiling. It does not remove it.</p>
</div>
`,

{
  id:'M06',
  title:'Constraint-time architecture governance',
  track:1,
  audience:['practitioner'],
  contentionClass:['code','validator'],
  duration:'40 min · 40 min lab',
  visuals:['mb_entropy_drift','mb_fitness_gate','mb_dependency_rule'],
  crossCard:`
<p>Architecture rules that live in a document cost a reviewer a glance on every diff, forever. The same rules as executable checks cost one afternoon each and then nothing. At five mobs, architecture governance is the largest single source of encodable rules on the platform, which makes it the largest available <strong>capacity multiplier</strong>.</p>
<table>
  <tr><th>The decision this module asks for</th><th>What it costs</th></tr>
  <tr><td>Name an <strong>architecture guardian</strong> who owns root steering and the fitness suite, measured on constraints encoded rather than reviews performed</td><td>Part of one senior engineer. If their calendar fills with reviews, the role has failed</td></tr>
  <tr><td>Budget one executable check per root invariant, and keep the root invariant list under ten</td><td>An afternoon per rule, once</td></tr>
</table>
<p>Two findings from the fixture worth carrying into a governance conversation. After twelve weeks of three-mob work the codebase held three error-handling idioms, two date libraries and four ways of asserting on a determination — no rule was broken, because there were no executable rules to break. And the platform's PHI annotation requirement, agreed by everyone and written down, silently stopped being applied when one mob's generated endpoints omitted it. <em>An invariant with no check is a preference.</em></p>
<p><em>Read the full module for:</em> which rules belong at generation time versus merge time, and why a fitness function with an unmeasured false-positive rate gets disabled within a month.</p>
`,
  body:`
<p>In most treatments, fitness functions are an architecture-hygiene topic. Here they are a capacity topic, and that reframing is why this module sits in Track 1 rather than with the mechanics. Every architectural rule you make executable is review time returned to a scarce human, permanently. Architecture governance is the largest single source of encodable rules on a platform — which makes it the largest available <strong>capacity multiplier</strong>.</p>

<h3>Entropy is not new. Its rate is.</h3>
<p>An agent makes locally-optimal decisions with excellent local justification. Asked to add retry logic, it adds a retry library — a real one, popular, well-maintained, and the third such library in the codebase. Nothing about that decision is wrong at the scale of one unit of work. Across five mobs and a quarter it is <strong>architecture entropy</strong> arriving at a rate no review cadence was designed for.</p>

<div data-viz="mb_entropy_drift"></div>

<p>The fixture is a modest example after twelve weeks of three-mob work: three error-handling idioms, two date libraries, two HTTP clients, four different ways to assert on a determination in tests. Every one of them was individually defensible, which is precisely why review did not stop them. A reviewer sees one diff; entropy is a property of the set.</p>
<p>The relevant term is <strong>dialect drift</strong>: five mobs, five idioms, one codebase, none of them wrong locally. It resists review as a control because the evidence for it is never in the change you are looking at.</p>

<h3>Move rules from review-time to constraint-time</h3>
<p><strong>Constraint-time governance</strong> means each architectural rule lives at the earliest point where it can be enforced mechanically rather than remembered.</p>

<div data-viz="mb_fitness_gate"></div>

<table>
  <tr><th>Where the rule lives</th><th>Enforcement</th><th>Right kind of rule</th><th>Failure mode</th></tr>
  <tr><td>Steering file</td><td>Advisory. The agent usually complies.</td><td>Conventions, naming, idiom preferences</td><td>Silently relaxed per mob — this is M12's whole subject</td></tr>
  <tr><td>Scaffold or generator</td><td>Present before the first line is written</td><td>Structural invariants: annotations, audit wiring, module layout</td><td>Only applies to new code; existing code drifts on</td></tr>
  <tr><td><strong>Fitness function</strong> in CI</td><td>Mechanical, every change, no exceptions</td><td>Layer boundaries, dependency direction, PHI paths, contract shape</td><td>False positives; mobs learn to disable it</td></tr>
  <tr><td>Runtime check</td><td>Blocks in production</td><td>Data-boundary and authorisation invariants</td><td>Fails late, when it is expensive</td></tr>
</table>
<p>The middle two rows are where the capacity comes from. A rule in a steering file costs a reviewer a glance on every diff forever; the same rule as a fitness function costs one afternoon once.</p>

<h3>PD-5: the dependency arrow that points the wrong way</h3>
<p><code>priorauth-clinical-rules</code> has a package that imports from the web tier — a display-formatting helper someone needed and nobody stopped. The library that both services depend on now depends on one of them, in one direction that was never designed and cannot be built independently.</p>

<div data-viz="mb_dependency_rule"></div>

<p>This is the canonical case for an executable layer rule, because it is invisible in review: the diff that introduced it was four lines and had a good reason. As a constraint it is one test that will never allow it again:</p>
<pre><code>@ArchTest
static final ArchRule clinical_rules_depend_on_nothing_above_them =
    noClasses().that().resideInAPackage("..clinical..")
      .should().dependOnClassesThat().resideInAnyPackage("..web..", "..portal..");</code></pre>
<p>Leave the planted violation in place on trunk when you are done with the lab — later modules need it, and PD-5 is curriculum rather than a bug to tidy up. Land your fix on a branch and let the test fail loudly on trunk, which is exactly the signal a new mob should meet on day one.</p>

<h3>PD-3: a constraint that existed only as a sentence</h3>
<p>The root steering file says every endpoint touching member data carries <code>@PhiBoundary</code>. The Gate mob's bolt dropped it — not maliciously, not even noticeably; the annotation was absent from the class they copied from, and the agent had no reason to add what it had not seen.</p>
<p>Nothing failed. Tests passed, review passed, and the audit trail for that path stopped being generated. The rule was real, written down, agreed by everyone, and had no mechanical existence at all. <em>An invariant with no check is a preference.</em> That sentence is the module in one line, and it is the answer to "but we already documented that".</p>

<h3>Cross-mob rules are contracts</h3>
<p>Some invariants cannot be checked inside one repository — the shape of the determination payload matters to <code>priorauth-web</code>, and no test in the api repository knows what the portal needs. The executable form of a cross-mob rule is a <strong>consumer-driven contract</strong>: a test the consumer writes, running in the provider's pipeline, failing when the provider breaks it.</p>
<p>That mechanism is what makes cross-repo change reviewable without a human holding both sides in their head. M09 shows what happens without it, and it is worse than a broken build — it is silence.</p>

<h3>What not to encode</h3>
<ul>
  <li><em>Taste.</em> A fitness function about naming style produces noise, and noise is how mobs learn to add an ignore annotation. The first ignore is the end of the mechanism.</li>
  <li><em>Anything with a false-positive rate you have not measured.</em> Run a candidate rule in report-only mode for a week and count. A rule that fires wrongly twice a week will be disabled inside a month, and you will not be told.</li>
  <li><em>Rules nobody can state.</em> The M05 limit applies here too: if the rule needs "it depends", it stays a human decision at Tier 3.</li>
</ul>
<p>Where an architectural rule genuinely resists encoding, the honest move is an <strong>architecture guardian</strong> — a named person who owns root steering and the fitness suite, measured on constraints encoded rather than reviews performed. If their calendar fills with reviews, the role has failed in the way M05 warned about.</p>
`,

<h4>Steps — Path A, Claude Code</h4>

  id:'M07',
  title:'Security review at generation volume',
  track:1,
  audience:['practitioner'],
  contentionClass:['validator','code'],
  duration:'35 min · 35 min lab',
  visuals:['mb_dependency_growth','mb_supply_chain_gate','mb_phi_leak'],
  crossCard:`
<p>Agents add dependencies enthusiastically and plausibly. In the fixture, one mob added 9 direct dependencies in a quarter; three mobs added 31, of which 14 brought new transitive packages — roughly 140 more third-party packages owned, with no change in the number of people reviewing them.</p>
<p>Human review does not scale to that and never did it well. A reviewer can judge whether a library call looks right; nobody reads the fourth level of a dependency tree. The planted advisory in this fixture is found by the pipeline in eleven seconds and by no reviewer at all.</p>
<table>
  <tr><th>The ask</th><th>Why this one</th></tr>
  <tr><td>Supply-chain checks in the merge queue, not in review: bill of materials per unit of work, advisory gate, licence gate</td><td>Applies to every mob's every change at three in the morning. The specialist's time moves to setting policy and handling exceptions</td></tr>
  <tr><td>Instrument <strong>security queue depth</strong> as its own number</td><td>Platforms that measure clinical queue time routinely leave this one invisible until an audit finds it</td></tr>
</table>
<p>The regulated-domain specific: agents log helpfully, and a helpful log line containing a member identifier is a reportable disclosure. It changes no behaviour, breaks no test, and reads as diligence in review. That control cannot be vigilance; it has to be a check that runs on every bolt.</p>
<p><em>Read the full module for:</em> where each check sits in the loop, and the two failure modes when an agent is asked to make the gate pass.</p>
`,
  body:`
<p>Security review has the same shape as clinical review: a scarce specialist, a queue, and a volume of changes that has just multiplied. It gets its own module because two of its failure modes are specific to generated code and neither is caught by a human reading a diff.</p>

<h3>Agents add dependencies enthusiastically and plausibly</h3>
<p>Ask for retry logic and you get a retry library. Ask for date arithmetic and you get a date library. Every one is real, popular, well-maintained, and unnecessary — and it arrives with a persuasive one-line justification in the pull request description.</p>

<div data-viz="mb_dependency_growth"></div>

<p>In the fixture, one mob added 9 direct dependencies in a quarter. Three mobs added 31, of which 6 were duplicates in function and 14 were transitively new — meaning the number of third-party packages the platform now owns rose by 140 while the number of people reviewing them stayed at one part-time specialist. That is the <strong>dependency surface</strong>, and it is the part of the estate that grows fastest under AI-DLC.</p>
<p>Human review does not scale here and it never did particularly well. A reviewer can assess whether a library call looks correct. They cannot assess whether a transitive package four levels down has a published advisory, and pretending otherwise is how the queue gets long without getting safer.</p>

<h3>Supply chain as constraint, not gate</h3>
<div data-viz="mb_supply_chain_gate"></div>
<p>Three mechanical checks, placed where they cost nothing per bolt:</p>
<table>
  <tr><th>Check</th><th>Where it runs</th><th>What it must do</th></tr>
  <tr><td><strong>SBOM per bolt</strong></td><td>Generated at build, attached to the unit of work</td><td>Give you the answer to "what did this bolt introduce" without a person reconstructing it later. This is also M16's evidence chain, produced as a by-product.</td></tr>
  <tr><td>CVE gate</td><td>In the merge queue, before landing</td><td>Block on new advisories at or above your agreed severity — including transitive. Blocking at merge rather than at review is the whole point: it applies to every bolt from every mob, at three in the morning.</td></tr>
  <tr><td>Licence check</td><td>Same gate</td><td>Fail on licences your legal team has not accepted. Agents pick libraries by popularity, not by licence compatibility.</td></tr>
</table>
<p>Note where these sit relative to review: the specialist's time goes to deciding policy — which severities block, which licences are acceptable, what the exception process is — not to inspecting individual dependency additions. That is the same conversion M05 described, applied to a different specialist.</p>

<h3>The PHI case is different, and worse</h3>
<p>Agents log helpfully. Asked to make a failure debuggable, an agent produces exactly the log line a good engineer would want, containing exactly the identifiers that make it a reportable breach.</p>

<div data-viz="mb_phi_leak"></div>

<p>Three properties make this the most dangerous generated-code pattern in a regulated system:</p>
<ul>
  <li>It looks like diligence. A reviewer scanning a diff sees good error handling.</li>
  <li>It is invisible in tests. The log line does not change behaviour, so nothing fails.</li>
  <li>It is discovered by a log audit weeks later, at which point the disclosure is historical fact and the conversation is with compliance rather than engineering.</li>
</ul>
<p>The control is not vigilance. It is a fitness function over log and exception paths, plus the <code>@PhiBoundary</code> enforcement from M06 — <strong>PHI-adjacent logging</strong> as a mechanical check, running on every bolt from every mob. Vigilance is what you have instead of a control, and it fails on the Friday of a release week.</p>

<h3>Tiering security review</h3>
<p>The M04 ladder applies with the specialist substituted. Most changes need no security attention at all; a small set needs it absolutely and cannot be delegated:</p>
<table>
  <tr><th>Tier</th><th>Example in this platform</th><th>Who validates</th></tr>
  <tr><td>0–1</td><td>Internal refactor, no new dependency, no data path change</td><td>Mechanical checks only</td></tr>
  <tr><td>2</td><td>New dependency, new outbound call, new public endpoint</td><td>Mob validator, with SBOM diff attached</td></tr>

<p>This module looks like plumbing and decides your scarce reviewer's workload, which is why it is worth twenty minutes of a leader's attention.</p>
<p>The mechanism: an agent asked for a feature produces one wide change spanning several units of work. Review of that change cannot be tiered — it collapses to the highest tier it contains, so a diff with one clinical line and forty cosmetic ones consumes clinical review for all of it. Stacked changes, one unit of work each, are what make M04's tiering physically possible. Without them your Tier 3 queue fills with column-width adjustments.</p>
<table>
  <tr><th>Number</th><th>Fixture value</th><th>What it tells you</th></tr>
  <tr><td>Rebases per landed bolt</td><td>0.2 at two mobs, 2.7 at six</td><td>The felt cost of code contention: afternoons spent re-landing finished work</td></tr>
  <tr><td>Time from ready-to-land to landed</td><td>2.3 hours at three mobs</td><td>The trunk-mechanics number that is legible to leadership</td></tr>
</table>
<p>The ask is a merge queue — serialised landing, whole-repository build — plus stacked changes as a working convention. Days of work, and it is one of the six prerequisites in M19 for a reason.</p>
<p><em>Read the full module for:</em> expand–contract schema sequencing so two mobs can land in either order, and why no merge queue spans repositories.</p>
`,
  body:`
<p>This is the module where code contention becomes concrete. Nothing here is novel practice — merge queues and expand–contract migrations predate agents by a decade. What is new is that they move from good hygiene to load-bearing, because the thing they protect against now happens several times a day.</p>

<h3>"Green on my branch" means nothing</h3>
<p>With one mob, a green branch is a reasonable proxy for a green trunk: nothing else landed since you branched. With six mobs it is a statement about a state of the world that no longer exists. The trunk your tests passed against is two merges old.</p>
<p>The only mechanism that fixes this is serialisation at the point of landing — a <strong>merge queue</strong> that rebases each change onto the actual current trunk, runs the suite, and lands it only if it still passes. Not a policy. A gate.</p>

<div data-viz="mb_merge_queue"></div>

<p>Two configuration decisions carry most of the value, and both are usually got wrong:</p>
<ul>
  <li><em>Batch, but bisect on failure.</em> Serial landing at 34 minutes a run caps you at fourteen changes a day, which is under three mobs' output. Batching four changes and bisecting on failure gets throughput back; the cost is that one bad change delays three good ones.</li>
  <li><em>Build the whole repository, not the changed module.</em> Agent diffs are wide and often leave a caller in a module nobody thought was affected. Module-scoped builds are exactly the optimisation that lets that through, and M13's dialect comparison shows one engine doing it reliably.</li>
</ul>

<h3>Diff width is the variable that changed</h3>
<p><strong>Diff width</strong> — how many files a change touches — is the reason collision rates went up. Two changes collide when they touch a common file, so for random diffs the collision probability rises with the product of the widths. Human bolts in the fixture average 4 files; agent bolts average 11, and the wide tail is much heavier: 8% of agent bolts touch more than 30 files.</p>
<table>
  <tr><th>Concurrent bolts</th><th>Avg files per bolt</th><th>Pairs with a shared file</th><th>Rebases per landed bolt</th></tr>
  <tr><td>2</td><td>4</td><td>0.3</td><td>0.2</td></tr>
  <tr><td>3</td><td>11</td><td>1.4</td><td>0.9</td></tr>
  <tr><td>6</td><td>11</td><td>6.1</td><td>2.7</td></tr>
</table>
<p>The last column is the one to instrument, because it is the one an engineer feels: at 2.7 rebases per landed bolt, most of a mob's afternoon is spent re-landing work that was finished before lunch. And each rebase is resolved by an agent that will produce something plausible.</p>

<h3>Stacked changes</h3>
<div data-viz="mb_stack_landing"></div>
<p>A <strong>stacked change</strong> is one unit of work per stack entry, landed in order, each reviewable alone. The discipline matters more under AI-DLC than it did before, for a specific reason: when an agent produces a 40-file diff spanning three units of work, the review that follows cannot be tiered. One entry needs the clinical SME; the other two do not; the combined change needs the SME for all of it.</p>
<p>So stacking is not only a trunk hygiene practice. It is what makes M04's tiering possible at all — an unstacked change collapses to the highest tier it contains, and your Tier 3 queue fills with cosmetic work.</p>

<h3>PD-1: two mobs, one migration version</h3>
<div data-viz="mb_migration_collision"></div>
<p>Appeals and Gate both write <code>V47__</code> migrations on the same day. Both branches are green — Flyway only sees one of them in each branch. The second to land fails on trunk, or worse, lands in a repository whose checksum validation is off and creates two divergent schema histories in two environments.</p>
<p>Renumbering makes the build pass. It does not resolve the actual collision, which is semantic: both migrations alter the same table, and applying them in either order produces a schema neither mob designed. The mechanical fix and the real fix are different things here, which is what makes this a good planted defect.</p>
<p>The durable answer is <strong>expand–contract</strong>: phase schema change so the two mobs can land in either order and neither breaks the other.</p>
<pre><code>Phase 1 — expand   add the new nullable column / new enum value; nobody reads it yet
Phase 2 — migrate  dual-write, backfill, both mobs deploy against the widened schema
Phase 3 — contract remove the old column once no consumer references it

Landing order between mobs is now irrelevant, which is the entire point.</code></pre>
<p>Add a fitness check that fails on a duplicate migration version at merge time. It is fifteen lines and it removes PD-1 as a class rather than as an incident.</p>

<h3>Landing across repositories</h3>
<p>Everything above serialises one repository. Nothing serialises three. There is no merge queue that spans <code>priorauth-api</code>, <code>priorauth-web</code> and <code>priorauth-clinical-rules</code>, so a change that must land in two of them lands in two separate queues, at two separate times, with production between them.</p>
<p>Two rules that hold in practice:</p>
<ul>
  <li><em>Land in dependency order, provider first,</em> and make the provider change backward compatible so the window between landings is safe. If the provider change cannot be backward compatible, it is an expand–contract sequence across repositories and it will take days.</li>
  <li><em>The consumer's contract test runs in the provider's pipeline</em> (M06). Otherwise the window is unmonitored, and the failure mode is not a broken build — it is silence. That silence is PD-9, and it is M09's subject.</li>
</ul>

<h3>What to instrument</h3>
<table>
  <tr><th>Metric</th><th>Why this one</th><th>Fixture baseline</th></tr>
  <tr><td>Rebases per landed bolt</td><td>The felt cost of code contention</td><td>0.9 at three mobs</td></tr>
  <tr><td>Merge queue depth and wait</td><td>Distinguishes infrastructure contention from code contention</td><td>peak 6, mean wait 41 min</td></tr>
  <tr><td>Time from ready-to-land to landed</td><td>The number that makes trunk mechanics visible to leadership</td><td>2.3 h at three mobs</td></tr>
  <tr><td>Duplicate-version rejections</td><td>Proves the PD-1 class is closed</td><td>0 after the check, 2 in the quarter before</td></tr>
</table>
`,

<p>One mob shipped a clinical criteria change. It went live in the service that consumes the shared library at the current version, and did nothing at all in the portal, which is pinned to an older one. No test failed anywhere. No alarm fired. Three weeks later a nurse noticed that the queue was showing denial reasons that no longer matched the service.</p>

  body:`
<p>Repository topology is where this method has no opinion at all, and the silence is load-bearing. Everything in AI-DLC assumes a single mob can see all the code it is changing. At a repository boundary that assumption stops being true, and nothing tells you it stopped.</p>

<h3>Three boundaries, routinely treated as one</h3>
<div data-viz="mb_three_boundaries"></div>
<table>
  <tr><th>Boundary</th><th>What it actually governs</th><th>Who set it, and when</th></tr>
  <tr><td><em>Repository</em></td><td>Deployment unit, versioning, release cadence</td><td>Whoever split the system, probably years ago, for reasons that may no longer hold</td></tr>
  <tr><td>Team</td><td>Ownership, accountability, review authority</td><td>The org chart, which changes on a different cycle</td></tr>
  <tr><td><strong>Context boundary</strong></td><td>What the model can see when it generates</td><td>Nobody decided it. It is an emergent property of your workspace layout and engine</td></tr>
</table>
<p>Most multi-team AI-DLC pain is a mismatch between these three. The one that hurts is the third, because it is the only boundary that nobody chose and the only one with no diagram anywhere in your organisation.</p>

<h3>Monorepo and multi-repo, honestly</h3>
<div data-viz="mb_context_cost"></div>
<table>
  <tr><th></th><th>Monorepo</th><th>Multi-repo</th></tr>
  <tr><td>Agent visibility</td><td>Everything, in principle</td><td>One repository, unless you assemble more by hand</td></tr>
  <tr><td>Context cost per bolt</td><td>High — retrieval quality falls as you widen it, and a wide context is not a read context</td><td>Low and cheap</td></tr>
  <tr><td>Cross-cutting change</td><td>Atomic. One commit, one review, one build</td><td>Spans days and versions. Two queues, production in between</td></tr>
  <tr><td>Contract enforcement</td><td>Compiler and tests, immediately</td><td>Only what you made explicit. Nothing else is checked</td></tr>
  <tr><td>What fails</td><td>Builds get slower; blast radius of a bad change is wider</td><td>Silence. Nothing fails, which is worse</td></tr>
</table>
<p>The trap in the monorepo column is worth stating precisely, because it is the newest of these facts: <em>the agent can see everything</em> is a claim about the repository, not about the model. In a codebase larger than the window, retrieval picks a subset, and the subset is chosen by relevance heuristics rather than by whether the change is correct. A monorepo removes the excuse for missing a caller; it does not remove the failure.</p>

<h3>PD-9: the version pin that silently discards a mob's work</h3>
<p>This is the module's centrepiece and the failure that most reliably convinces a senior engineer that repository topology is not an aesthetic question. Step through it:</p>

<div data-viz="mb_version_noop"></div>

<p>Nothing in that sequence is a bug in anyone's code. Gate's change is correct. The api's bump is correct. The web pin was set deliberately eighteen months ago during an incident, by someone who has since left, and is still doing exactly what it was asked to do. The platform is behaving as configured and the outcome is that a clinical change reached half of production.</p>
<p>That is a <strong>version-pin no-op</strong>, and its defining property is that no test fails and no alarm fires. Compare it to a broken build, which announces itself in ninety seconds. The failure mode of multi-repo is not breakage. It is silence, and silence has no owner.</p>
<p>The fixture's discoverable symptom, deliberately placed so the defect is findable rather than merely cruel: the nurse queue shows denial reasons that no longer match what the api returns for the same request, and there is a support ticket in <code>platform-fixture/evidence/</code> filed by a nurse who noticed.</p>

<h3>Making contracts visible to the agent</h3>
<p>Across a repository boundary, an agent has no reliable view of the other side. It will infer the contract from names, and it will be plausible and wrong. Three mechanisms that work, cheapest first:</p>
<ol>
  <li><strong>Consumer-driven contract</strong> tests running in the provider's pipeline (M06). The only mechanism that turns a cross-repo assumption into a build failure. If you adopt one thing from this module, adopt this.</li>
  <li><em>Compatibility encoded, not documented.</em> A machine-readable minimum consumer version in the provider's manifest, checked at release. "Consumers should upgrade" in a release note is not a control.</li>
  <li><em>Version drift visibility.</em> A scheduled job that reports the deployed version of every shared library in every consumer, and fails when the spread exceeds one minor version. Fifty lines, and it would have caught PD-9 on day two rather than week three.</li>
</ol>

<h3>The pragmatic middle</h3>
<table>
  <tr><th>Approach</th><th>Worth it when</th><th>Cost you are accepting</th></tr>
  <tr><td>Vendored contracts</td><td>Two repositories, stable schema</td><td>Copies drift; you need a check that they match</td></tr>
  <tr><td>Generated clients from a spec</td><td>The provider has a real spec and honours it</td><td>Generation pipeline becomes load-bearing infrastructure</td></tr>
  <tr><td>Contracts repository</td><td>Three or more consumers of one provider — this platform</td><td>A third thing to version, and a new place for changes to queue</td></tr>
  <tr><td>Merge the repositories</td><td>The split has no independent deployment reason left</td><td>Weeks of build work, and a bigger blast radius per change</td></tr>
</table>
<p>For this platform the defensible move is a contracts directory in <code>priorauth-clinical-rules</code> with consumer tests from both consumers running in its pipeline, plus the drift report. That is a week of work and it closes PD-9 as a class.</p>

<div class="callout honest-limit">
  <div class="k">Honest limit — the method has no position here</div>
  <p>AI-DLC does not tell you how to organise repositories, and it does not tell you what to do when a unit of work crosses one. It assumes one mob can see all the code. That assumption is the first thing to break at multi-team scale, and the method's silence is not an oversight you can read around — there is nothing in it to apply. Everything in this module is this course's addition, and you should present it that way rather than as guidance from the method.</p>
  <p>Two further limits worth being blunt about. <em>Contract tests only cover contracts you wrote down.</em> PD-9 concerns behaviour inside an evaluation function — a rule change, not a signature change — and a contract test written against the payload shape would have passed. Catching it required a test asserting on evaluation outcomes, which someone has to think to write; there is no mechanism that finds the unwritten test. And <em>no tooling resolves the underlying question</em>, which is whether these three repositories should be three repositories. That is a topology decision with real deployment consequences, and this course cannot make it for you — it can only make the cost of the current answer visible.</p>
</div>
`,

  crossCard:`
<p>Infrastructure contention is the least glamorous of the three classes and often the actual constraint this quarter. It is also the only one you can fix with money, which makes it the cheapest conversation you will have about this programme.</p>
<table>
  <tr><th>Fixture number</th><th>Value</th><th>Reading</th></tr>
  <tr><td>Suite runtime, week 0 to week 12</td><td>11 min becomes 34 min</td><td>Coverage rose, no test was wrong, and landing capacity fell by two thirds</td></tr>

</table>
<p>The line item people underestimate is not compute. Ephemeral test environments in this domain need synthetic clinical data realistic enough for criteria to evaluate meaningfully, because production data carries protected health information and cannot be cloned. Generating it is real platform work, it needs clinical input, and it removes both the environment queue and part of the review burden.</p>
